["Which globally famous musician was born in Stone Town, Zanzibar in 1946?","Bob Marley","Freddie Mercury","Peter Gabriel","Mick Jagger",1,"Freddie Mercury, lead vocalist of Queen, was born Farrokh Bulsara in Stone Town."],

["Prison Island near Stone Town is famous for its colony of:","Rare parrots","Giant Aldabra tortoises","Lemurs","Fruit bats",1,"Prison Island hosts a colony of giant Aldabra tortoises, some estimated to be over 100 years old."],

["The ideal combination itinerary for South African clients visiting Tanzania is:","Zanzibar only","Dar es Salaam city break then Zanzibar","A mainland Tanzania safari followed by a Zanzibar beach extension","Zanzibar plus a Kilimanjaro climb",2,"The classic Tanzania itinerary combines a Serengeti or Ngorongoro safari with a Zanzibar beach extension."],
["What should consultants advise about dress code when clients visit Stone Town?","No dress code required","Western clothing is banned","Dress modestly (covered shoulders and knees) as Zanzibar is predominantly Muslim","National dress required",2,"Zanzibar is approximately 97% Muslim; visitors should dress modestly away from the beach."],

["Zanzibar is most commonly reached from Dar es Salaam by:","Bridge","Helicopter","Ferry (about 2 hours) or short domestic flight (20 minutes)","Cruise ship only",2,"Both options are available; the ferry takes about 2 hours while the domestic flight takes 20 minutes."],
["Mnemba Atoll, off Zanzibar northeast coast, is particularly known for:","Beach parties","Excellent diving, snorkelling and whale shark sightings","Budget accommodation","Spice production",1,"Mnemba Atoll is one of East Africas premier diving and snorkelling locations with strong marine biodiversity."],
["Which side of mainland Tanzania does Zanzibar lie off, making it easy to combine with a mainland safari?","West coast","East coast","Northern border","Southern border",1,"Zanzibar lies off Tanzanias east coast, making it a natural beach extension after a northern safari circuit."],
["What style of architecture is commonly used in upscale Zanzibar resorts to reflect the islands historic trading links?","Cape Dutch","Arabian or palace-style","Victorian","Art Deco",1,"Many upscale Zanzibar resorts use Arabian and palace-style architecture, reflecting the islands centuries of Arab trading influence."],
["Which Zanzibar coastal area is associated with laid-back luxury resorts away from the main tourist hubs?","Stone Town","Nungwi","Marumbi (east coast)","Mji Mkongwe",2,"Marumbi on the east coast hosts laid-back luxury resorts offering a quieter alternative to the busier north coast hubs."],
["What is the name of the channel separating Zanzibar from mainland Tanzania?","Mozambique Channel","Pemba Channel","Zanzibar Channel","Tanzania Strait",2,"The Zanzibar Channel separates the island of Zanzibar (Unguja) from the Tanzanian mainland."],
["Which nearby island, also part of the Zanzibar archipelago, is historically known for major clove production?","Mafia Island","Pemba Island","Mnemba Island","Chumbe Island",1,"Pemba Island, part of the Zanzibar archipelago, has historically been a major centre of clove production."],
["Zanzibar's culture is often described as a melting pot of which three influences?","Europe, Asia and Oceania","Africa, the Middle East and Asia","North America, Africa and Europe","South America, Africa and Asia",1,"Zanzibar's history of trade has created a melting pot blending African, Middle Eastern and Asian cultural influences."],

["Beyond beaches, what type of terrain can adventurous couples explore in Zanzibar via hiking and biking trails?","Glacial valleys","Lush forests","Desert canyons","Snow-capped mountains",1,"Zanzibar's lush forests offer hiking and biking trails for couples and adventurous travellers seeking more than just the beach."],
["What gives Zanzibar's tourism appeal a unique edge compared to many other Indian Ocean islands?","Its ski resorts","Its blend of beach relaxation with deep Swahili, Arab and spice trading history","Its lack of any cultural sites","Its cold climate",1,"Zanzibar combines relaxing beach holidays with a genuinely rich cultural and trading history, setting it apart from purely beach-focused islands."],
["What food experience is commonly recommended to visitors exploring Stone Town's culinary scene?","The Forodhani Gardens night food market","A formal sit-down dinner only","Fast food chains","Self-catering only",0,"The Forodhani Gardens night food market in Stone Town is a popular spot for sampling Zanzibar's diverse street food."],
["Why might a consultant position Zanzibar as more culturally rich than some other pure beach destinations?","It has no culture","Its centuries of trading history with Africa, Arabia and Asia gives it deep historic and culinary layers","It is purely a modern resort island","It has no historic sites",1,"Zanzibar's centuries of trade with Africa, Arabia and Asia have created deep historic, architectural and culinary layers beyond the beach."],
["What is a popular full-day excursion combining culture and nature near Stone Town?","A spice farm tour","A ski lesson","A desert safari","A river cruise",0,"Spice farm tours near Stone Town let visitors see, smell and taste the cloves, vanilla and other crops behind Zanzibar's Spice Island name."],
["Zanzibar's economy has historically relied heavily on which two industries, beyond modern tourism?","Mining and manufacturing","Spice production and fishing","Oil and gas","Technology and finance",1,"Spice production and fishing have historically been central to Zanzibar's economy, alongside its growing tourism industry."],
["What should consultants highlight about Zanzibar's appeal to clients who enjoyed mainland Tanzania's safari culture?","Zanzibar has no connection to mainland culture","Zanzibar shares Tanzania's warm hospitality while adding a distinct coastal, spice-trading heritage","Zanzibar is a completely different country with no link","Zanzibar discourages safari clients from visiting",1,"Zanzibar shares Tanzania's hospitality and culture while offering a distinct coastal, spice-trading heritage to complement a safari trip."],
["Which airline offers direct flights from Johannesburg to Zanzibar?","South African Airways","FlySafair","British Airways","Emirates",1,"FlySafair operates direct flights from Johannesburg to Zanzibar, departing Friday, Saturday and Tuesday at 09h00."],

["Besides FlySafair, how else can Zanzibar be accessed via East Africa?","Via Dar es Salaam on Air Tanzania, or via Nairobi on Kenya Airways","Only via Cairo","Only via Addis Ababa","There are no other options",0,"Zanzibar can also be accessed via Dar es Salaam on Air Tanzania or via Nairobi on Kenya Airways."],
["What mandatory insurance must all visitors to Zanzibar purchase, at approximately USD 44pp?","Zanzibar Health Insurance","Zanzibar Inbound Travel Insurance, through the Zanzibar Insurance Corporation","Global Travel Cover","No mandatory insurance is required",1,"All visitors must purchase mandatory Zanzibar Inbound Travel Insurance for approximately USD 44pp through the Zanzibar Insurance Corporation."],

["When is Zanzibar's dry season, ideal for beach and diving?","March to May and September to November","June to October, and December to February","January and February only","There is no dry season",1,"Zanzibar's dry season runs June to October (cooler) and December to February (hot and dry, festive season)."],
["When do Zanzibar's 'long rains' typically occur?","June to August","March to May","September to November","December to February",1,"The long rains occur March to May, a low season period with fewer crowds and some lodges closing."],

["Which Zanzibar beach area is ideal for couples and honeymooners, close to Mnemba Atoll?","Jambiani","Matemwe","Kendwa","Nungwi",1,"Matemwe, on the northeast coast, is ideal for couples and honeymooners, being close to Mnemba Atoll for diving and snorkelling."],
["Where are the best beaches generally located on Zanzibar, and where should consultants avoid promising good beaches?","Best in the East, North or Northwest; the West (Stone Town) does not have good beaches","Best in the West only","Best in the South only","All coasts are equally good for beaches",0,"The best beaches are in the East, North or Northwest; Stone Town, on the West, is good to visit but does not have good beaches."],
["What is Safari Blue, a recommended full-day activity in Zanzibar?","A game drive on the mainland","A full-day dhow trip with snorkelling, a seafood BBQ and dolphin sightings","A spice farm walking tour","A Stone Town cultural tour",1,"Safari Blue is a full-day dhow trip featuring snorkelling, a seafood BBQ and dolphin sightings."],
["Where is the famous restaurant 'The Rock' located, and what is unique about accessing it?","In Stone Town; accessible by taxi","In the middle of the ocean off Michamvi on the East Coast; guests walk in at low tide and leave by boat as the tide comes in","On Prison Island; accessible only by ferry","In Nungwi; accessible by 4x4 only",1,"The Rock is located in the ocean off Michamvi on the East Coast; guests arrive on foot at low tide and must leave by boat once the tide comes in."],
["Which forest, home to red colobus monkeys, is a recommended cultural and nature tour in Zanzibar?","Kichwele Forest","Jozani Forest","Masingini Forest","Mujuni Forest",1,"Jozani Forest is home to red colobus monkeys and is a recommended stop on cultural tours of Zanzibar."],
["What key tide-related advice should consultants give clients booking Zanzibar's East Coast beaches?","Tides have no effect on swimming","Some East Coast beaches aren't swimmable at low tide, so clients should always be briefed; the North Coast is generally unaffected","All beaches are swimmable at all times","Only West Coast beaches are affected by tides",1,"Some beaches, especially on the East Coast, aren't swimmable at low tide, so clients should always be briefed; the North Coast is generally not affected by tide."],
["Can guests be legally married in Zanzibar?","No, only symbolic ceremonies are offered","Yes, guests can be legally married, completing certain formalities before and after with help from the DMC","Only Zanzibari citizens can marry there","Weddings are not permitted at all",1,"Guests can be legally married in Zanzibar, completing certain formalities before and after the marriage, with Exclusive Tours and Safaris able to advise."],

["Bali is an island within which country?","Malaysia","Philippines","Indonesia","Thailand",2,"Bali is one of over 17,000 islands making up Indonesia."],

["Which Bali area is most suitable for families wanting a gated resort with a calm beach?","Kuta","Canggu","Nusa Dua","Legian",2,"Nusa Dua is a purpose-built gated resort enclave with a calm lagoon beach, purpose-designed for families."],
["The approximate flight time from Johannesburg to Bali with one connection is:","6 hours","9 hours","12 to 13 hours","16 hours",2,"Bali is typically 12 to 13 hours from Johannesburg via Singapore, Dubai or Kuala Lumpur."],
["The best time to visit Bali to avoid the rainy season is:","January to March","April to June","May to September","October to December",2,"May to September is Balis dry season with the most reliable beach and sightseeing weather."],

["The time difference between South Africa and Bali is approximately:","2 hours","4 hours","6 hours","8 hours",2,"South Africa is UTC+2 and Bali is UTC+8, placing Bali 6 hours ahead of South Africa."],

["Jimbaran Bay in Bali is specifically famous for:","Rooftop cocktail bars","Beachfront seafood restaurants with tables set on the sand at sunset","Surf competitions","Luxury shopping malls",1,"Jimbaran Bay restaurants set tables directly on the beach and are known for fresh seafood dining at sunset."],
["Which Bali area appeals to a surfer and digital nomad crowd with trendy cafes?","Nusa Dua","Kuta","Canggu","Sanur",2,"Canggu is Balis hippest neighbourhood, popular with surfers, creatives and digital nomads."],
["The Gili Islands are located off which island and accessible from Bali by fast boat?","Java","Sumatra","Lombok","Sumbawa",2,"The Gili Islands are off the northwest coast of Lombok and accessed from Bali by a 1.5 to 2 hour fast boat."],
["For a client interested in traditional Balinese culture, which area is recommended?","Seminyak beach clubs","Kuta nightlife","Ubud: temples, cooking classes and traditional dance performances","Nusa Dua water sports",2,"Ubud offers the richest immersion in Balinese culture, with temple visits, traditional dance and artisan crafts."],
["What is the key difference between Seminyak and Nusa Dua for a client choosing within Bali?","No meaningful difference","Trendy restaurants and boutiques versus a gated family resort enclave","Budget versus luxury","North versus south Bali",1,"Seminyak suits independent travellers seeking boutiques and restaurants; Nusa Dua suits families wanting a self-contained resort."],
["South African passport holders visiting Bali can enter Indonesia visa-free for stays of up to:","15 days","30 days","60 days","90 days",1,"South Africans currently qualify for 30-day visa-free entry into Indonesia. Always verify current policy at time of booking."],
["Bali produces one of the worlds most expensive coffees, made from beans eaten and excreted by civets. What is it called?","Kona Coffee","Luwak Coffee","Blue Mountain Coffee","Geisha Coffee",1,"Luwak Coffee is one of Balis most famous and unusual exports, prized for its distinctive processing method."],
["Which waterfall in Bali features a natural rock waterslide popular with adventurous travellers?","Tegenungan Waterfall","Aling-Aling Waterfall","Gitgit Waterfall","Sekumpul Waterfall",1,"Aling-Aling Waterfall is known for its natural rock waterslide, a popular adventure stop in northern Bali."],
["Balis famous rice terraces, popular for sightseeing and photography, are most famously found near which town?","Ubud (Tegalalang)","Kuta","Nusa Dua","Sanur",0,"The Tegalalang rice terraces near Ubud are among Balis most photographed and visited natural attractions."],
["Which unique experience is available in parts of Bali, letting guests walk on the seabed without a diving certification?","Snuba diving only","Sea Walker underwater walk experience","Submarine tour only","Glass-bottom boat only",1,"The Sea Walker experience allows guests to walk on the seabed in a special helmet without needing a diving certification."],
["Which Indonesian island area near Bali is popular for trips to see Komodo dragons?","Gili Islands","Nusa Penida","Flores / Komodo Islands","Lombok",2,"The Komodo Islands, accessed via Flores or Labuan Bajo, are the only place in the world to see wild Komodo dragons."],
["Gamelan, a traditional musical ensemble often heard in Bali, is most commonly associated with which type of performance?","Western rock concerts","Traditional Balinese dance and ceremonial performances","Opera","Jazz festivals",1,"Gamelan ensembles provide the rhythmic, percussive soundtrack to traditional Balinese dance and religious ceremonies."],
["Frangipani, a fragrant flower often associated with Bali's atmosphere, is commonly used for what purpose?","Cooking spice only","Offerings, decoration and creating a calming sensory atmosphere","Building material","Textile dye only",1,"Frangipani flowers are widely used in Balinese offerings and decoration, contributing to the island's distinctive calming atmosphere."],
["Where are manta rays commonly spotted on diving and snorkelling trips near Bali?","Nusa Penida (Manta Point)","Ubud rice terraces","Kuta Beach shallows","Mount Batur summit",0,"Manta Point off Nusa Penida is one of the most popular spots near Bali for snorkelling and diving with manta rays."],

["What is a key appeal of Bali for clients seeking a wellness-focused getaway?","Its ski resorts","Yoga retreats, spas and holistic healing experiences, especially around Ubud","Its desert climate","Its lack of nature",1,"Ubud in particular is renowned for yoga retreats, spas and holistic healing experiences, making Bali a strong wellness destination."],
["What does subak refer to in Balinese culture, closely tied to the islands famous rice terraces?","A traditional dance","A centuries-old cooperative irrigation system, recognised by UNESCO","A type of textile","A religious festival",1,"Subak is a centuries-old cooperative irrigation system central to Bali's rice terraces, recognised by UNESCO as a cultural landscape."],

["What is the All Indonesia Integrated Declaration, required from 1 September 2025?","A customs form for excess baggage only","A declaration all international visitors must submit within 3 days of arrival, generating a QR code to present on arrival","A visa extension form","A hotel registration form",1,"From 1 September 2025, all international visitors to Indonesia must complete and submit the All Indonesia Integrated Declaration within 3 days of arrival, generating a QR code to save and present."],

["What should consultants note about beach access for most hotels in Kuta, Legian and Seminyak?","All hotels are directly beachfront","Guests typically have to cross the road or walk a couple of blocks to reach the beach","There is no beach access at all","Beach access requires a boat transfer",1,"For most hotels in Kuta, Legian and Seminyak, guests have to cross the road or walk a couple of blocks to reach the beach."],
["What is distinctive about Nusa Dua's main beach, Pantai Mengiat?","It has no reef and strong currents throughout","An offshore reef break creates calm waters near the beach for swimming, with good surfing beyond the reef","It is only accessible by boat","It is closed to tourists",1,"Pantai Mengiat, Nusa Dua's main beach, features an offshore reef break; waters close to the beach are calm for swimming, with surfing beyond the reef."],

["What is Sanur best known for as a resort area in Bali?","Clifftop luxury villas","A laid-back charm with a long beachfront promenade connecting several beaches, arts and culture","Black-sand surfing beaches","Nightlife and beach clubs only",1,"Sanur has laid-back charm, with a long beachfront promenade connecting several beaches, plus arts and culture."],
["Which two iconic spots are highlighted on a Nusa Penida day trip?","Tegalalang and Ubud Market","Kelingking Beach and Crystal Bay (also Broken Beach and Angel's Billabong)","Waterbom and Circus Waterpark","Gili Trawangan and Gili Air",1,"A Nusa Penida day trip typically covers Kelingking Beach, Broken Beach, Angel's Billabong and Crystal Bay."],

["Verbier in Switzerland is primarily suited to which skill level?","Complete beginners only","Young children learning to ski","Confident intermediate and advanced skiers","Snowboarders only",2,"Verbier is known for demanding off-piste terrain and is best suited to confident intermediate and expert skiers."],
["For a first-time ski family from South Africa, the best resort type is:","The most challenging off-piste resort available","A purpose-built French resort with a proper ski school and beginner areas","A summer resort that also does some winter activities","A snowboard-only park",1,"Purpose-built French resorts like La Plagne, Les Gets or Morzine have purpose-designed nursery areas and reputable ski schools."],
["The approximate flight time from Johannesburg to Geneva (main Alpine gateway) is:","7 hours","11 hours","14 hours","16 hours",1,"The direct flight from Johannesburg to Geneva takes approximately 11 hours."],
["Off-piste skiing means skiing:","On specially marked advanced runs","On groomed prepared slopes only","On ungroomed terrain outside the marked and patrolled piste network","Only during poor visibility",2,"Off-piste skiing takes place on natural ungroomed terrain beyond the prepared slopes."],
["Late February to March is popular for ski holidays because:","It is always the cheapest time","Early season snow is at its best","Accumulated snow depth is good and days are noticeably longer with more sunshine","Resorts are always less crowded",2,"Late season offers reliable deep snow built up over winter and increasingly sunny longer spring days."],
["Morzine in France is part of which large cross-border ski area?","The Three Valleys","Espace Killy","Portes du Soleil","Grand Massif",2,"Morzine is part of the Portes du Soleil, one of Europes largest ski areas spanning the French-Swiss border."],
["Which French resort hosted the 1992 Winter Olympics, cementing the regions status as a major ski destination?","Chamonix","Albertville","Courchevel","Megeve",1,"Albertville hosted the 1992 Winter Olympics, with events spread across the surrounding French Alps resorts."],
["What term describes a mountain hut or restaurant where skiers can stop for food on the slopes?","Chalet","Mountain restaurant or refuge","Gondola","Piste map",1,"A mountain restaurant or refuge is a hut or eatery on the slopes where skiers can stop to eat during the day."],
["Which piece of safety equipment is essential for off-piste skiing, used to locate a skier buried in snow?","Ski poles","Avalanche transceiver (beacon)","Goggles","Helmet camera",1,"An avalanche transceiver, or beacon, is essential off-piste safety equipment used to locate a buried skier quickly."],
["What is a piste map used for?","Booking lift passes","Showing the layout and difficulty of marked runs on a ski resort","Tracking weather forecasts","Measuring snow depth",1,"A piste map shows the layout, difficulty and connections of all marked runs across a ski resort."],
["Which country is home to the ski resort of Whistler, popular with North American skiers?","USA","Canada","Switzerland","New Zealand",1,"Whistler Blackcomb is located in British Columbia, Canada and co-hosted the 2010 Winter Olympics."],
["Club Med is well known in the ski industry for offering which type of resort experience?","Self-catering budget chalets only","All-inclusive ski resorts with meals, lessons and equipment often bundled together","Camping-only ski experiences","Ski resorts with no dining options",1,"Club Med is known for all-inclusive ski resorts where meals, lessons and often equipment hire are bundled into one simple package."],
["Which essential item should consultants remind first-time skiers to pack or hire, beyond standard ski gear?","Swimwear only","Good quality thermal base layers and gloves for warmth","Summer hiking boots","A wetsuit",1,"Good quality thermal base layers and warm gloves are essential for comfort on the slopes, beyond just standard ski gear."],
["Which Italian ski region is popular for combining skiing with charming alpine villages and excellent food?","Sicily","The Dolomites or Italian Alps (e.g. Pragelato, Sestriere)","The Italian Riviera","Tuscany",1,"The Dolomites and Italian Alps regions, including resorts like Pragelato and Sestriere, combine skiing with charming villages and renowned food."],
["Why might travel consultants recommend booking ski holidays well in advance?","Prices and availability are unaffected by timing","Popular resorts and accommodation can sell out, especially over peak weeks like school holidays","Late bookings are always cheaper","Ski resorts have unlimited capacity",1,"Popular ski resorts and accommodation can sell out well in advance, particularly during peak weeks such as school holidays."],
["What is the benefit of an all-inclusive ski package that bundles lift passes, lessons and meals?","It removes all flexibility","It simplifies budgeting and planning, particularly valuable for first-time ski families","It is always more expensive than self-organising","It has no real benefit",1,"Bundled packages simplify budgeting and planning, which is particularly valuable for first-time ski families unfamiliar with all the costs involved."],
["Which type of insurance add-on is essential to mention specifically for clients booking a ski holiday?","Standard travel insurance is always sufficient","Winter sports cover, as standard policies typically exclude skiing injuries","No insurance is needed for skiing","Only health insurance, not travel insurance",1,"Winter sports cover is essential, as standard travel insurance policies typically exclude skiing-related injuries."],
["What should consultants tell first-time skiers about ski lessons?","Lessons are unnecessary for anyone","Group or private lessons with a qualified instructor are strongly recommended for safety and progression","Lessons are only for children","Lessons are banned for adults",1,"Group or private lessons with a qualified instructor are strongly recommended for both safety and steady skill progression."],
["Why might a consultant suggest layering clothing for a ski holiday rather than one heavy coat?","Layering has no benefit","Layering allows better temperature regulation as activity levels and weather change throughout the day","It is purely a fashion choice","Only one layer is ever needed",1,"Layering allows skiers to adjust to changing temperatures and activity levels throughout the day far more effectively than one heavy coat."],
["What is a common non-skiing activity offered at many European ski resorts for non-skiing companions?","No alternative activities exist","Spa treatments, sleigh rides, ice skating or simply enjoying the village atmosphere","Surfing lessons","Desert safaris",1,"Spa treatments, sleigh rides, ice skating and the village atmosphere itself give non-skiing companions plenty to enjoy."],
["Why is travel insurance with medical evacuation cover particularly important for ski holidays?","It has no relevance to skiing","Mountain injuries may require specialist evacuation or repatriation, which can be extremely costly without cover","Evacuation is always free in Europe","Ski resorts provide free medical care to all visitors",1,"Mountain injuries can require costly specialist evacuation or repatriation, making medical evacuation cover especially important for ski holidays."]
],
cr:[
["Royal Caribbean International is best described as:","A luxury small-ship cruise line","One of the worlds largest mass-market cruise lines","A river cruise specialist","A South Africa-based line",1,"Royal Caribbean is one of the worlds biggest cruise companies, known for innovative mega-ships."],
["Standard cruise pricing typically includes:","Everything including all shore excursions","Accommodation, most meals and onboard entertainment; drinks, speciality dining and excursions are usually extra","The cabin only","Drinks and the cabin only",1,"Standard cruise fares bundle cabin, buffet and main restaurant dining and onboard shows; drinks packages and excursions are charged separately."],
["The difference between an inside and a balcony cabin is:","No meaningful difference","Inside cabins are larger","Inside cabins have no window or natural light; balcony cabins have a private outdoor terrace","Balcony cabins are located below the waterline",2,"Inside cabins have no windows; balcony staterooms have sliding glass doors opening onto a private outdoor space."],
["The port of embarkation is:","The final port on the itinerary","Where passengers board the ship at the start of the voyage","The ships country of registration","The deepest port on the route",1,"The embarkation port is where the cruise begins; popular options for South Africans include Barcelona, Miami and Southampton."],
["Shore excursions on a cruise are:","Walks on the ships outer deck","Organised tours and activities when the ship docks at a port","Swims from the stern of the ship","Transfers between ships",1,"Shore excursions are trips and activities at each port of call, bookable through the cruise line or independently."],
["The Mediterranean cruise season broadly runs:","Year-round","January to March","April to October","December only",2,"Mediterranean cruises operate April to October with peak season June to September."],
["Norwegian Cruise Line (NCL) pioneered which concept?","Formal black-tie dining every night","Adults-only ships exclusively","Freestyle Cruising with no fixed dining times or dress codes","River cruising",2,"NCL revolutionised cruising with Freestyle Cruising, allowing passengers to dine anywhere anytime without formal requirements."],
["A tender port is one where:","The weather is always calm","The ship docks directly","The ship anchors offshore and small boats ferry passengers ashore and back","Medical facilities are available ashore",2,"At tender ports the water is too shallow for the ship to dock; passengers are ferried to land by the ships tender boats."],
["On-Board Credit (OBC) is:","A credit card for use ashore","A cash refund after the cruise","A credit loaded onto the passenger shipboard account for onboard spending","A promotional discount on the cabin",2,"OBC is a credit available for use on drinks, speciality dining, spa treatments or shore excursions."],
["For a couple celebrating a milestone anniversary wanting elegance and intimacy, the best recommendation is:","Carnival (party atmosphere)","MSC (family focused)","A luxury small-ship line such as Silversea or Seabourn","Norwegian (freestyle casual)",2,"Luxury small-ship lines carry under 600 guests, offer highly personalised service and are ideal for milestone occasions."],
["A repositioning cruise offers good value because:","The ship has a new captain","The itinerary is shorter","The ship is moving between deployment regions seasonally, offering longer voyages at reduced one-way rates","A different entertainment team is onboard",2,"Repositioning cruises are priced below regular sailings because they are one-directional and operationally necessary."],
["A cruise and stay package combines:","Permanent residency on a ship","A cruise with hotel nights pre or post-voyage at the departure or destination port","A stay in a cruise terminal hotel only","A cruise with unlimited port calls",1,"Cruise and stay packages are popular for South Africans wanting to explore an embarkation city like Barcelona before sailing."],
["For a family with young children, which cruise lines have the most comprehensive kids programmes?","Silversea and Seabourn","Cunard and Princess","MSC, Royal Caribbean and Norwegian","Azamara and Oceania",2,"MSC, Royal Caribbean and Norwegian are well known for extensive age-grouped childrens clubs and family-friendly cabin configurations."],
["Port taxes on a cruise booking are:","A service charge added by the cruise line","Government-imposed fees for using port facilities, passed directly to passengers","A voluntary tip for port staff","A tourist departure tax paid on return",1,"Port taxes and fees are mandatory government charges for using port facilities at each destination port of call."],
["Celebrity Cruises is positioned in the market as:","A budget family cruise line","A river cruise specialist","A premium cruise line with a refined design-led experience","The worlds largest cruise brand",2,"Celebrity Cruises offers a more sophisticated experience than mass-market lines, with elevated dining, design and service standards."],
["What is a muster drill on a cruise ship?","A dining reservation system","A mandatory safety briefing and assembly point exercise","An onboard talent show","A captains welcome reception",1,"A muster drill is a mandatory safety briefing where passengers learn assembly points and procedures in case of emergency."],
["What does the term fly-cruise mean?","A cruise with a pool shaped like wings","A package combining a flight to the embarkation port with a cruise","A cruise with onboard flight simulators","A river cruise only",1,"A fly-cruise package combines flights to the embarkation port with the cruise itself, sold as one combined booking."],
["Which deck of a cruise ship typically has the least motion, important for guests prone to seasickness?","The highest deck at the front","A mid-ship, lower deck","The rear (aft) upper deck","It makes no difference",1,"Mid-ship, lower deck cabins experience the least motion, making them the best choice for guests prone to seasickness."],
["What is the term for the daily programme listing onboard activities, dining times and entertainment on a cruise?","The Manifest","The Cruise Compass or Daily Planner","The Itinerary Card","The Voyage Log",1,"The Cruise Compass, or equivalent daily planner, lists all onboard activities, dining times and entertainment for each day."],
["MSC Cruises, popular with South African clients sailing from Durban, is headquartered in which country?","Italy","Switzerland","Norway","USA",1,"MSC Cruises is headquartered in Geneva, Switzerland, despite its strong Italian heritage and branding."],
["What are gratuities on a cruise typically used for?","Port taxes","Daily tips covering services from housekeeping and dining staff, often prepaid or charged automatically","Fuel surcharges","Entertainment booking fees",1,"Gratuities are daily tips covering housekeeping and dining staff services, often added automatically or paid in advance."],
["Which three cruise lines are most commonly highlighted as top mass-market brands for South African clients?","Disney, Costa and AIDA","MSC, Norwegian Cruise Line and Royal Caribbean","Seabourn, Silversea and Regent","Star Clippers, Windstar and Ponant",1,"MSC, Norwegian Cruise Line and Royal Caribbean are consistently among the top mass-market cruise brands booked by South African clients."],
["What is the key difference between an ocean cruise and a river cruise?","There is no difference","River cruises sail along inland waterways through cities, while ocean cruises sail between coastal or island ports","River cruises only operate in winter","Ocean cruises never visit ports",1,"River cruises travel along inland waterways through cities, while ocean cruises sail between coastal or island ports."],
["Which river cruise companies are known for their scenic European river itineraries along rivers like the Rhine and Danube?","Royal Caribbean and Carnival","Uniworld and U River Cruises","MSC and NCL","Disney Cruise Line",1,"Uniworld and U River Cruises are well known for scenic European river itineraries along rivers such as the Rhine and Danube."],
["What is a key consideration when helping a client choose a cabin category?","All cabins are identical regardless of price","Location, view, space and budget all affect the right cabin choice for that clients needs","Cabin choice has no impact on the cruise experience","Only the cheapest cabin should ever be recommended",1,"Location, view, space and budget all genuinely affect which cabin category best suits a particular clients needs and priorities."],
["Why might a consultant recommend booking shore excursions through the cruise line rather than independently?","Cruise line excursions guarantee the ship will not leave without you if there are delays","Independent excursions are always better","Cruise line excursions are always more expensive with no benefit","There is no difference in risk",0,"Cruise line excursions guarantee the ship will wait if the excursion is delayed, removing the risk of being left behind at port."],
["What is a key advantage of cruising for first-time international travellers?","It requires extensive independent trip planning","It bundles accommodation, meals, entertainment and transport between destinations into one simple booking","It only visits one destination","It is always more expensive than independent travel",1,"Cruising bundles accommodation, meals, entertainment and transport between multiple destinations into one simple, low-hassle booking."],
["Which cruise line is particularly well known for sailing from Durban, making it convenient for South African passengers?","Disney Cruise Line","MSC Cruises","Princess Cruises","Holland America Line",1,"MSC Cruises is particularly well known for operating sailings from Durban, making it highly convenient for South African passengers."],
["What should consultants clarify with clients about onboard dining when comparing cruise lines?","All cruise lines offer identical dining","Dining styles vary, from fixed traditional dining times to flexible freestyle dining across multiple venues","Dining is never included in cruise pricing","Only buffet dining exists on cruise ships",1,"Dining styles vary significantly between cruise lines, from fixed traditional sittings to flexible freestyle dining across multiple venues."],
["Why might travel insurance be especially important to recommend for a cruise booking?","Cruises carry no risk","Cruises often involve significant upfront payment, multiple ports and potential itinerary changes, all worth protecting","Cruise lines automatically refund everything","Insurance is not available for cruises",1,"Cruises often involve significant upfront payment and exposure to itinerary changes, making travel insurance an important recommendation."]
],
af:[
["Victoria Falls sits on the border between which two countries?","Zimbabwe and Mozambique","Zimbabwe and Zambia","Zambia and Botswana","Zimbabwe and South Africa",1,"Victoria Falls (Mosi-oa-Tunya) straddles the Zimbabwe and Zambia border on the Zambezi River."],
["The local name Mosi-oa-Tunya for Victoria Falls translates to:","The Great Waterfall","The River of Life","The Smoke that Thunders","The Falls of the Zambezi",2,"Mosi-oa-Tunya is the Tonga name meaning The Smoke that Thunders, referring to the spray visible for kilometres."],
["Which side of Victoria Falls generally offers the best frontal views of the main curtain?","Zambia side (Livingstone)","Both sides are identical","Neither side has good views","Zimbabwe side (Victoria Falls town)",3,"The Zimbabwe side offers comprehensive frontal views; the Zambia side is better for the Devils Pool experience."],
["The best time to visit Victoria Falls for peak water flow and drama is:","July to September","October to November","March to May","December to January",2,"March to May sees maximum flow following the rainy season, creating the most thunderous spray and drama."],
["The main flight gateway from South Africa to Victoria Falls is:","Durban","Cape Town","Johannesburg","Pretoria",2,"Most connections to both the Zimbabwe and Zambia sides of Victoria Falls route through Johannesburg."],
["Ponta do Ouro in Mozambique is best described as:","The capital of Mozambique","The southernmost Mozambique coastal destination, popular for long weekend escapes by 4x4 from South Africa","A major island resort","A deep sea fishing charter hub only",1,"Ponta do Ouro sits just over the South African border and is popular for diving, dolphins and weekend self-drive trips."],
["Which town is the main gateway for accessing the Bazaruto Archipelago?","Maputo","Beira","Vilankulos","Inhambane",2,"Vilankulos is the departure point for flights and boat transfers to the Bazaruto Archipelago islands."],
["The Bazaruto Archipelago is primarily known for:","Budget backpacker beaches","Industrial fishing","Luxury island lodges and pristine marine life including dugongs","City tourism",2,"The Bazaruto Archipelago offers some of Africas finest island lodge experiences with world-class snorkelling, diving and fishing."],
["Which is the largest island in the Bazaruto Archipelago?","Benguerra Island","Magaruque Island","Santa Carolina","Bazaruto Island",3,"Bazaruto Island is the largest in the archipelago, known for freshwater lakes, dunes and diverse birdlife."],
["The Quirimbas Archipelago in northern Mozambique is best positioned to clients as:","A budget family beach destination","A remote ultra-exclusive destination with pristine reefs and rich Swahili and Arab trading history","A well-developed resort area","A water sports training hub",1,"The Quirimbas is one of Africas most exclusive remote island destinations with centuries of trading history."],
["The Great Migration in Kenyas Masai Mara is most spectacular between:","January to March","April to June","July to October","November to December",2,"The wildebeest migration reaches the Masai Mara roughly July to October, with dramatic Mara River crossings."],
["The Ngorongoro Crater in Tanzania is significant for safaris because:","It is the worlds deepest crater","It is a self-contained ecosystem with one of the highest concentrations of wildlife in Africa","It is only accessible by helicopter","It is only known for birdwatching",1,"The Ngorongoro Crater is a collapsed volcanic caldera forming a natural wildlife enclosure with extraordinary game density."],
["South African travellers to Mozambique currently require:","No documentation","A visa applied for in advance only","A special travel permit","A visa on arrival (always verify current requirements at time of booking)",3,"South Africans can currently obtain a Mozambique visa on arrival; requirements can change so always verify before booking."],
["Kenya is in which time zone relative to South Africa?","Same time zone","1 hour behind South Africa","1 hour ahead of South Africa","3 hours ahead of South Africa",2,"Kenya (EAT, UTC+3) is 1 hour ahead of South Africa (SAST, UTC+2)."],
["Which currency is most widely accepted in Zimbabwes tourism sector?","South African Rand only","Zimbabwean Dollar only","US Dollar","British Pound",2,"The US Dollar is the most practical and widely accepted currency for tourism across Zimbabwe."],
["Chobe National Park, known for its huge elephant herds, is located in which country?","Zambia","Botswana","Namibia","Zimbabwe",1,"Chobe National Park in Botswana is famous for hosting one of Africas largest concentrations of elephants."],
["The Okavango Delta, a unique inland delta and UNESCO World Heritage Site, is found in which country?","Botswana","Zambia","Namibia","Tanzania",0,"The Okavango Delta is in Botswana and is a UNESCO World Heritage Site renowned for its unique inland delta ecosystem."],
["Which African country is home to gorilla trekking in Volcanoes National Park?","Kenya","Tanzania","Rwanda","Uganda",2,"Volcanoes National Park in Rwanda is one of the worlds premier destinations for mountain gorilla trekking."],
["Sossusvlei, known for its towering red sand dunes, is located in which country?","Botswana","Namibia","Zimbabwe","Mozambique",1,"Sossusvlei in the Namib Desert, Namibia, is famous for some of the tallest sand dunes in the world."],
["Which East African country is home to both the Serengeti and the Ngorongoro Crater?","Kenya","Uganda","Tanzania","Rwanda",2,"Both the Serengeti and Ngorongoro Crater are located in Tanzania, making it a classic safari combination."],
["Mount Kilimanjaro, Africas tallest peak, is located in which country?","Kenya","Tanzania","Uganda","Rwanda",1,"Mount Kilimanjaro, the worlds tallest free-standing mountain, is located in Tanzania."],
["Approximately how many days does the classic Kilimanjaro climb typically take?","1 to 2 days","5 to 9 days","20 or more days","A single overnight hike",1,"The classic Kilimanjaro climb typically takes 5 to 9 days, depending on the route chosen, to allow for proper acclimatisation."],
["The Valley of the Kings, home to many ancient Pharaoh tombs, is located in which African country?","Morocco","Egypt","Sudan","Tunisia",1,"The Valley of the Kings in Egypt is home to numerous tombs of ancient Pharaohs and is a major historical attraction."],
["How many tombs in the Valley of the Kings can typically be viewed by visitors?","5","18","50","100",1,"Around 18 tombs in the Valley of the Kings can typically be viewed by visitors, including that of Tutankhamun."],
["Masai Mara National Reserve, famous for the wildebeest migration, is located in which country?","Tanzania","Kenya","Uganda","Ethiopia",1,"The Masai Mara National Reserve in Kenya is one of the best places to witness the Great Migration and the Big Five."],
["Which African country is home to the pyramids of Giza, one of the most iconic ancient wonders in the world?","Sudan","Egypt","Libya","Tunisia",1,"The pyramids of Giza, including the Great Pyramid, are located just outside Cairo in Egypt."],
["Which safari term describes staying overnight in a remote tented camp deep within a reserve?","Day trip","Bush camp / fly-camping","City stopover","Lodge transfer",1,"Bush camping or fly-camping involves an overnight stay in a remote tented camp deep within a reserve, away from permanent lodges."],
["What does the term game drive refer to on an African safari?","A formal dinner event","A guided outing in a vehicle to view wildlife","A type of fishing trip","A walking-only tour",1,"A game drive is a guided outing, usually in a 4x4, to view wildlife within a reserve or national park."],
["Why is a night drive often offered as an add-on at safari lodges?","It guarantees Big Five sightings","It increases the chance of seeing nocturnal animals not visible during the day","It is cheaper than day drives","It replaces the need for a day drive entirely",1,"Night drives use spotlights to reveal nocturnal animals such as leopards, hyenas and owls that are rarely seen during the day."],
["What is a sundowner, a popular tradition on African safaris?","A type of binoculars","Drinks enjoyed in the bush while watching the sunset","A morning wake-up call","A type of safari vehicle",1,"A sundowner is a relaxed drinks stop in the bush, timed to enjoy the sunset, often at the end of an afternoon game drive."],
["Which African country is home to the Serengeti National Park?","Kenya","Tanzania","Uganda","Zambia",1,"The Serengeti National Park, famed for the Great Migration, is located in Tanzania."],
["What is the main reason malaria precautions are recommended for most safari destinations in Southern and East Africa?","There is no real risk anywhere","Many safari regions, excluding a few malaria-free reserves, fall within malaria zones","It is only a concern in West Africa","Malaria has been eradicated across Africa",1,"Most Southern and East African safari regions fall within malaria zones, aside from a handful of specifically malaria-free reserves."],
["Which African nation is home to both Table Mountain and the Cape Winelands?","Namibia","South Africa","Botswana","Zimbabwe",1,"Table Mountain and the Cape Winelands are both located in South Africa, in the Western Cape."],
["Lake Naivasha and Lake Nakuru, known for flamingos, are located in which country?","Tanzania","Kenya","Uganda","Zambia",1,"Lake Naivasha and Lake Nakuru, both known for large flamingo populations, are located in Kenya."],
["What is the primary reason consultants should always double check current visa requirements before quoting an African safari itinerary?","Visa rules across African countries are static and never change","Visa requirements can change with little notice and vary significantly by nationality and country","All African countries share one universal visa","Visas are never required for safari travel",1,"Visa requirements vary by country and can change with little notice, so consultants must always verify current rules before quoting."],
["Which big cat is most associated with Namibias desert-adapted populations, found in areas like Damaraland?","Tiger","Leopard","Snow leopard","Cougar",1,"Namibias Damaraland is known for its desert-adapted leopard and elephant populations, uniquely suited to arid conditions."],
["What is the term for a private, exclusive-use safari vehicle and guide booked for one group only?","Shared transfer","Private vehicle / exclusive use safari","Scheduled coach tour","Self-drive only",1,"A private or exclusive-use safari vehicle is booked solely for one group, offering a fully personalised game drive experience."],
["Why might a consultant recommend combining a safari with a beach extension such as Zanzibar or Mauritius?","It is always cheaper","It balances the active, early-morning pace of a safari with relaxed downtime afterwards","It is required by law","Beach extensions replace the need for a safari",1,"Combining a safari with a beach extension balances the early starts and activity of a safari with relaxing downtime afterwards."],
["Which of these does the term Big Five NOT typically include?","Lion","Cheetah","Buffalo","Rhino",1,"The Big Five consists of lion, leopard, elephant, buffalo and rhino; the cheetah is not part of this traditional grouping."],
["Which African safari country is well known for guided walking safaris in addition to vehicle-based game drives, particularly in its national parks?","Zambia","Egypt","Morocco","Tunisia",0,"Zambia, particularly South Luangwa National Park, pioneered the walking safari and remains famous for this style of guiding."]
],
mv:[
["The Maldives consists of approximately how many islands?","200","500","1,200","3,000",2,"The Maldives comprises approximately 1,200 islands grouped in 26 natural atolls in the Indian Ocean."],
["South African passport holders visiting the Maldives receive:","A visa applied for in advance","A paid visa on arrival","No entry permitted","A free 30-day tourist visa issued on arrival",3,"South Africans receive a complimentary 30-day tourist visa on arrival at Velana International Airport."],
["The most iconic accommodation category in the Maldives is:","Beachfront tents","City centre business hotels","Cave lodges","Overwater villas built directly above the lagoon",3,"Overwater bungalows and villas are the defining image of the Maldives and the most sought-after room category."],
["Approximate total flight time from Johannesburg to the Maldives with one connection:","5 hours","9 hours","12 to 14 hours","18 hours",2,"The journey typically takes 12 to 14 hours via Dubai, Doha or Colombo."],
["How are guests transferred from Male airport to more remote resort islands?","By private road","By helicopter only","By sailing dhow only","By seaplane or speedboat depending on the resorts distance from Male",3,"Speedboats serve nearby atolls; seaplanes serve more distant resorts and offer spectacular aerial views over the atolls."],
["The best time to visit the Maldives for beach and diving conditions is:","June to August","November to April","May to October","Year-round equally",1,"November to April is the dry northeast monsoon season with the best visibility, calmest seas and most reliable weather."],
["A house reef at a Maldives resort means:","The resort rooftop bar","A coral reef directly accessible from the beach, allowing snorkelling without a boat","A freshwater pool feature","An aquarium built into the resort lobby",1,"A house reef allows guests to walk from their beach directly into world-class coral snorkelling."],
["The Baa Atoll in the Maldives is designated as:","A golf destination","A UNESCO Biosphere Reserve famous for whale sharks and manta ray aggregations","A nightlife and entertainment hub","A budget travel zone",1,"Baa Atoll is a UNESCO Biosphere Reserve; Hanifaru Bay within it sees mass aggregations of whale sharks and manta rays."],
["The Maldives is generally priced compared to Mauritius as:","An identical price point","Significantly cheaper","Significantly more expensive","Only marginally different",2,"The Maldives, particularly for overwater villa products, is positioned at a higher price point than Mauritius."],
["The Maldives policy on alcohol is:","Freely available everywhere","Completely banned nationwide","Only available at designated resort islands; local inhabited islands are alcohol-free","Available only at the international airport",2,"Alcohol is served at resort islands under licence; the inhabited local islands observe Islamic law and are dry."],
["A seaplane transfer to a remote Maldives resort typically takes:","5 minutes","15 to 40 minutes","2 to 3 hours","Seaplanes are not available in the Maldives",1,"Seaplane transfers to outer atolls range from 15 to 40 minutes and are considered a highlight of the arrival experience."],
["Maldives resorts are typically sold on which pricing basis?","Room only at budget rates","All-inclusive or full board at premium to ultra-luxury rates","Self-catering only","Bed and breakfast only",1,"Maldives resorts are premium to ultra-luxury products, generally sold on full board or all-inclusive packages."],
["The main international gateway airport for the Maldives is:","Ari Atoll Airport","Baa Atoll Airport","South Male Airport","Velana International Airport (MLE) in Male",3,"Velana International Airport in North Male Atoll is the primary entry point for all international arrivals."],
["For a South African honeymooning couple, the Maldives is best sold on:","Budget value and easy accessibility","Nightlife and entertainment options","Cultural immersion and city exploration","Overwater villa seclusion, turquoise lagoons, world-class snorkelling and complete privacy",3,"The Maldives honeymoon proposition centres on private overwater luxury, pristine marine settings and total escape."],
["Which atoll is home to Male and Velana International Airport?","South Male Atoll","Ari Atoll","Baa Atoll","North Male Atoll (Kaafu Atoll)",3,"Male and the international airport sit within the North Male Atoll, also known as Kaafu Atoll."],
["What is the local language spoken in the Maldives?","Sinhala","Dhivehi","Tamil","Malay",1,"Dhivehi is the official language of the Maldives, related to Sinhala but distinct in script and vocabulary."],
["Which sport is the Maldives particularly renowned for among diving enthusiasts, thanks to channels rich in pelagic life?","Wreck diving only","Drift diving / channel diving with mantas and sharks","Ice diving","Cave diving exclusively",1,"The Maldives is famous for drift and channel diving, where strong currents bring mantas, sharks and pelagic species close to divers."],
["What is a Maldivian dhoni traditionally used for?","A type of overwater villa","A traditional wooden boat used for transport and fishing","A spa treatment","A type of fish curry",1,"The dhoni is a traditional Maldivian wooden boat, historically used for fishing and inter-island transport."],
["Which Maldivian resort feature, often marketed as a unique dining experience, involves dining below the waves?","Skybar dining","Underwater restaurant","Beach BBQ only","Floating breakfast only",1,"Several Maldives resorts offer underwater restaurants, allowing guests to dine while surrounded by marine life below the waterline."],
["What is a key reason the Maldives is marketed as ideal for privacy and exclusivity?","It has thousands of budget hostels","Many islands host only one or two resorts, meaning guests share the island with very few other visitors","All resorts are located in one large city","Public transport connects every island",1,"Many Maldives islands host only one or two resorts, meaning guests effectively share the island with very few other visitors."],
["Maldives holiday packages from South Africa typically connect via flights through which region?","West Africa","The Middle East","South America","Western Europe only",1,"Most Maldives connections from South Africa route via the Middle East, with hubs like Dubai or Doha."],
["What type of accommodation, situated directly over the ocean, is considered the signature Maldives experience?","A treehouse","A water villa (overwater villa)","A desert tent","A houseboat",1,"The overwater villa, perched directly above the lagoon, is the signature Maldives accommodation experience."],
["Which activity is commonly highlighted as a top draw for the Maldives beyond relaxation?","Skiing","Snorkelling and diving among vibrant coral reefs","Mountain climbing","Desert safaris",1,"Snorkelling and diving among vibrant coral reefs is one of the Maldives' biggest draws beyond simple beach relaxation."],
["Why is the Maldives often recommended for fun-seeking families as well as honeymooners?","It only suits one traveller type","Many resorts offer both romantic seclusion options and dedicated family-friendly facilities, depending on the property chosen","Families are not permitted in the Maldives","It is only suitable for solo travellers",1,"Depending on the resort chosen, the Maldives can suit either romantic seclusion for honeymooners or family-friendly facilities for fun-seeking families."],
["What should consultants mention about visa requirements for South Africans visiting the Maldives?","A visa must be arranged months in advance","No visa is required before travel; a free visa is issued on arrival","A paid visa is required at the embassy","South Africans are not permitted to visit",1,"South Africans do not need to arrange a visa before travel; a free tourist visa is issued on arrival in the Maldives."],
["Why might a consultant suggest researching the specific resort carefully rather than just the destination when selling a Maldives package?","All Maldives resorts are identical","Each resort island is distinct in size, vibe and inclusions, since many islands host only a single property","Resort choice has no impact on the experience","Maldives resorts cannot be compared",1,"Since many islands host only a single resort, each property has its own distinct size, vibe and inclusions worth researching carefully."],
["What type of meal plan is most commonly associated with Maldives all-inclusive holiday packages?","Room only","All-inclusive, covering meals, drinks and often some activities","Self-catering only","Breakfast only",1,"Maldives all-inclusive packages typically cover meals, drinks and often a range of included activities for a no-fuss holiday."],
["Which client profile is the Maldives explicitly marketed toward, beyond honeymooners?","Budget backpackers only","Beach lovers, water adventurists, foodies, cocktail enthusiasts and fun-seeking families","Business travellers only","Winter sports enthusiasts",1,"Beyond honeymooners, the Maldives is marketed toward beach lovers, water adventurists, foodies, cocktail enthusiasts and fun-seeking families."],
["Why does the Maldives appeal strongly to clients wanting an exotic but relatively convenient beach escape from South Africa?","It requires a complex multi-visa process","It offers daily flight connections and no visa requirement, combined with a dramatically different tropical island setting","It has no flight connections from South Africa","It is closer to South Africa than any other beach destination",1,"Daily flight connections and no visa requirement, combined with its dramatically different tropical setting, make the Maldives appealing yet convenient."],
["Which two airlines are highlighted as most popular for accessing the Maldives?","Qatar Airways via Doha and Emirates via Dubai","Singapore Airlines and Cathay Pacific","British Airways and Virgin Atlantic","SAA and Kenya Airways",0,"Qatar Airways via Doha and Emirates via Dubai are the recommended and most popular airlines for accessing the Maldives."],
["What is the checked and hand luggage allowance on a Maldives seaplane transfer?","No limit","20kg checked plus 3kg hand luggage","30kg checked plus 10kg hand luggage","10kg checked only",1,"Seaplane transfers in the Maldives allow 20kg checked luggage plus 3kg hand luggage, an important allowance to flag to clients."],
["What is the checked luggage allowance on a Maldives domestic flight plus speedboat transfer?","20kg checked plus 5kg hand luggage","No limit","50kg checked","15kg checked only",0,"Domestic flight plus speedboat transfers allow 20kg checked luggage plus 5kg hand luggage."],
["Is there a luggage limit on Maldives speedboat-only transfers?","Yes, 20kg","Yes, 10kg","No limit","Yes, 5kg",2,"Speedboat-only transfers in the Maldives have no luggage limit, unlike seaplane and domestic flight transfers."],
["During what hours do Maldives seaplanes operate?","24 hours a day","Only during daylight hours, arrivals before 15:30 and departures after 09:00","Only at night","Only on weekends",1,"Seaplanes operate only during daylight hours, with arrivals before 15:30 and departures after 09:00, and do not fly in bad weather."],
["Up to what approximate travel time is a speedboat transfer ideal for in the Maldives?","30 minutes","1 hour","3 hours","5 hours",1,"Speedboat transfers are ideal for resorts up to around 1 hour away; longer journeys are not recommended as seas can be rough."],
["Why might a guest choose a domestic flight plus speedboat transfer over a seaplane?","It is more expensive but faster","It is more affordable, works at any time of day, and still operates in bad weather","It has no luggage allowance","It is only available to 5-star guests",1,"A domestic flight plus speedboat transfer is more affordable than a seaplane, suits any time of day, and still operates in bad weather, though it requires schedule alignment."],
["What can guests expect to find in Maldives seaplane and domestic flight lounges while waiting to depart?","Full alcohol service","Light snacks, soft drinks, tea and coffee, but no alcohol","Only bottled water","A duty-free shop only",1,"Lounges serve light snacks, soft drinks, tea and coffee, but no alcohol, while guests wait for their onward transfer."],
["What is the Green Tax in the Maldives?","An optional environmental donation","A compulsory tax per person, per night (adults, children and infants), included in bookings","A one-off airport departure tax","A tax only applicable to water villas",1,"The Green Tax is compulsory per person, per night, applying to adults, children and infants, and is included in bookings."],
["What advice does the guide give about booking split stays across more than one Maldives resort?","Always book resorts in different atolls for variety","Try to book resorts in the same Atoll where a speedboat transfer is possible, to avoid wasting a day travelling back to Male","Split stays are not possible in the Maldives","Split stays must always use two seaplane transfers",1,"For split stays, it's best to book resorts in the same Atoll where a speedboat transfer is possible, otherwise a day can be wasted travelling back to Male."],
["Are legal weddings possible in the Maldives?","Yes, fully legal weddings are common","No, legal weddings are not possible; only symbolic or 'mock' ceremonies are offered","Only for Maldivian citizens","Only in Male",1,"Legal weddings are not possible in the Maldives; only symbolic or 'mock' wedding ceremonies are offered to guests."],

["Where should guests stay in the Maldives for the best chance of seeing whale sharks?","North Male Atoll","Baa Atoll","South Ari Atoll","Raa Atoll",2,"Guests should stay in the South Ari Atoll for the best chance of seeing whale sharks."],
["Why do some Maldives surf resorts limit the number of daily surf passes to around 40?","To reduce costs","To avoid congestion in the surf line-up","Due to government regulation only","To protect the reef from damage",1,"Some surf resorts limit surf passes to around 40 daily to avoid congestion, keeping the surfing experience enjoyable."],
["Which two Maldives resorts in the collection are noted as dedicated surf resorts?","Sun Siyam Iru Fushi and Riu Atoll","Cinnamon Dhonveli and Adaaran Hudhuranfushi","Emerald Maldives and Brennia Kottefaru","Heritance Aarah and Siyam World",1,"Cinnamon Dhonveli and Adaaran Hudhuranfushi are surf resorts that are part of the collection, known for their surf breaks."],
["What must all Maldives-bound travellers complete within 96 hours before travel?","A visa application","An Online Health Declaration","A customs declaration","A hotel confirmation form",1,"Travellers must complete an Online Health Declaration within 96 hours before travel to the Maldives."],
["What is the Maldives' policy on bringing alcohol into the country?","Unlimited alcohol may be brought in","Alcohol is only permitted in resorts; no alcohol may be brought into the Maldives","Alcohol may only be brought in for personal resort use","There are no restrictions on alcohol",1,"Alcohol is only permitted within resorts under licence; no alcohol may be brought into the Maldives by visitors."],
["What footwear norm, sometimes called 'barefoot luxury', is common on Maldives resort beaches?","Sandals are compulsory","Shoes are not worn on the beaches","Formal shoes only in the evening","Diving boots at all times",1,"Shoes are typically not worn on Maldives resort beaches, part of the 'barefoot luxury' experience."],
["How do most Maldives resorts typically differ from Mauritius resorts in terms of children's facilities?","They offer identical supervised Kids Clubs","Most do not have supervised Kids Clubs like Mauritius, though accommodation and facilities remain family friendly","Children are not permitted at all","Only Kids Clubs are offered, with no other family facilities",1,"Most Maldives resorts don't have supervised Kids Clubs like those in Mauritius, though accommodation and facilities are still family friendly, with some resorts offering quiet zones or water villa slides."],

me:[
["Which Middle Eastern city is home to the worlds tallest building, the Burj Khalifa?","Abu Dhabi","Doha","Ras al Khaimah","Dubai",3,"The Burj Khalifa in Dubai stands at 828 metres and is the tallest structure ever built."],
["South African passport holders visiting the UAE require:","A UAE visa applied in advance","A visa on arrival","A biometric appointment","No visa; South Africans enter visa-free for up to 30 days",3,"South Africans enjoy visa-free access to the UAE for short stays, making it one of the most accessible Middle Eastern destinations."],

["The best time to visit Dubai from a weather perspective is:","July and August","April to June","November to March","Year-round equally",2,"November to March offers pleasant temperatures of 20 to 25 degrees, ideal for outdoor activities, beach and sightseeing."],

["The local currency of Dubai and the UAE is:","Saudi Riyal","Kuwaiti Dinar","Omani Rial","UAE Dirham",3,"The UAE Dirham (AED) is the official currency, pegged to the US Dollar."],

["The iconic Atlantis resort is located on which Dubai development?","Dubai Marina","Downtown Dubai","Jumeirah Beach Road","Palm Jumeirah",3,"Atlantis The Palm sits at the apex of the Palm Jumeirah man-made island and is one of Dubai's most recognisable resorts."],
["Ras al Khaimah is gaining popularity with South African travellers because:","It has the most shopping malls in the UAE","It is cheaper to fly to than Dubai","It has the largest airport in the UAE","It offers a more relaxed alternative to Dubai with Jebel Jais, adventure activities and luxury beach resorts",3,"RAK is increasingly popular for its mountains, zip lines, quiet beaches and a more tranquil atmosphere compared to Dubai."],
["Qatars capital city and major airline hub is:","Dubai","Muscat","Riyadh","Doha",3,"Doha is Qatars capital and the hub of Qatar Airways, one of the major carriers connecting South Africa to global destinations."],
["Abu Dhabi is best described in relation to Dubai as:","Identical to Dubai","Only a stopover city","A budget destination","A more cultural and refined emirate with the Louvre Abu Dhabi and the Sheikh Zayed Grand Mosque",3,"Abu Dhabi offers a more cultural experience, with the Louvre Abu Dhabi, Sheikh Zayed Grand Mosque and Formula 1 circuit."],
["Dubai is popular as a stopover destination because:","Flights are free","It requires a long-stay visa","It is only a transit airport","World-class hotels, shopping, dining and attractions packed into one city make even 2 to 3 nights very rewarding",3,"Dubai's density of experiences makes it ideal as a stopover en route to Europe, the USA or the Far East."],

["Which area of Dubai would you recommend for clients wanting to visit the Burj Khalifa, Dubai Mall and the Dubai Fountain?","Jumeirah Beach Residence","Deira","Downtown Dubai","Dubai Marina",2,"Downtown Dubai is home to the Burj Khalifa, Dubai Mall and the Dubai Fountain, making it the ideal base for clients wanting easy access to these landmarks."],
["Which of these is NOT a waterpark found in Dubai or Abu Dhabi?","Aquaventure","Wild Wadi","Legoland Waterpark","Universal Studios Waterworld",3,"Aquaventure (Atlantis The Palm), Wild Wadi, Legoland Waterpark and Yas Island Waterworld are all popular Dubai and Abu Dhabi waterparks; Universal Studios Waterworld does not exist there."],
["When booking the At the Top experience at the Burj Khalifa, which levels do standard ticket holders visit?","Levels 80 and 81","Levels 100 and 101","Levels 124 and 125 (higher levels available for a supplement)","Levels 148 and 149 only",2,"The standard At the Top experience takes visitors to levels 124 and 125, with access to level 148 available as a premium supplement."],
["The Dubai Mall is home to which famous indoor attraction featuring sharks and rays?","Dubai Aquarium and Underwater Zoo","Ocean World","SeaQuarium","Atlantis Aquaventure",0,"The Dubai Aquarium and Underwater Zoo inside The Dubai Mall is one of the largest suspended aquariums in the world."],
["Which annual shopping event draws tourists to Dubai with citywide discounts and entertainment?","Dubai Summer Surprises only","Dubai Shopping Festival","Gulf Bargain Week","Emirates Mega Sale",1,"The Dubai Shopping Festival is a major annual retail event drawing visitors with citywide discounts, raffles and entertainment."],

["Which traditional Arabian sport, often demonstrated for tourists, involves a falcon?","Falconry","Polo","Archery","Camel racing only",0,"Falconry is a traditional Arabian sport, often demonstrated for tourists as part of cultural and heritage experiences."],

["What is the Dubai Frame, a more recent architectural landmark attraction?","A giant picture-frame-shaped structure offering views over old and new Dubai","An underwater tunnel","A racing circuit","A desert oasis",0,"The Dubai Frame is a giant picture-frame-shaped structure offering panoramic views over both old and new Dubai."],
["Why might a consultant position a Dubai stopover as ideal for families with a long-haul connection to Europe or the Far East?","Families should avoid stopovers entirely","It breaks up a long journey with engaging, family-friendly activities like waterparks and the aquarium","Dubai has no family activities","Stopovers are not permitted with children",1,"A Dubai stopover breaks up a long journey with engaging, family-friendly activities such as waterparks and the Dubai Aquarium."],
["What is abra, a traditional mode of water transport still used in Dubai today?","A type of overwater villa","A traditional wooden boat used to cross Dubai Creek","A desert vehicle","A type of camel saddle",1,"The abra is a traditional wooden boat still used today to cross Dubai Creek, offering an inexpensive and authentic local experience."],

["What is Ain Dubai?","A historic waterway","The world's largest observation wheel","A desert safari company","A shopping mall",1,"Ain Dubai is the world's largest observation wheel, offering 360-degree views from Bluewaters Island."],

["Which day-trip destination near Dubai is home to Ferrari World, Yas Waterworld, Warner Bros and Seaworld?","Sharjah","Abu Dhabi (Yas Marina)","Ajman","Fujairah",1,"Yas Marina in Abu Dhabi is a great day trip, home to 4 theme parks: Yas Waterworld, Ferrari World, Warner Bros and Seaworld."],

au:[

["The best time to visit Cairns and tropical northern Australia is:","November to April (wet season with cyclone risk)","May to October (dry season with stable weather)","Year-round equally","Only during school holidays",1,"May to October is the dry season in tropical Australia, ideal for reef activities with the best visibility and no cyclone risk."],
["Kangaroo Island, known for wildlife and natural scenery, is off the coast of which state?","Queensland","New South Wales","Western Australia","South Australia",3,"Kangaroo Island off South Australia offers accessible wildlife encounters including sea lions, koalas and diverse birdlife."],
["Perth in Western Australia is significant for South African travellers because:","It has no beaches","It is the closest Australian city to South Africa with shorter flight times and a relaxed lifestyle","It is only accessible by cruise ship","It is in the same time zone as South Africa",1,"Perth is geographically the closest Australian city to South Africa and is known for its beaches, lifestyle and Margaret River wine region."],

["Where can travellers reliably see and interact with koalas and kangaroos in a safe, sanctuary setting?","Only in the wild with no facilities","Dedicated wildlife sanctuaries and zoos found in most major Australian cities","Koalas cannot be seen by tourists","Only at Uluru",1,"Dedicated wildlife sanctuaries and zoos in most major Australian cities offer safe, reliable opportunities to see koalas and kangaroos."],
["Which Australian city, known for its river and cultural precincts, is the capital of Queensland?","Cairns","Brisbane","Gold Coast","Townsville",1,"Brisbane, known for its river and vibrant cultural precincts, is the capital city of Queensland."],
["What is the Hunter Valley, located near Sydney, particularly known for?","Skiing","Wine tasting and vineyard tours","Desert safaris","Coral reef diving",1,"The Hunter Valley, near Sydney, is one of Australia's most popular wine regions, known for wine tasting and vineyard tours."],
["Why might consultants advise clients to book Great Barrier Reef tours through reputable, certified operators?","Certification has no relevance","Certified operators follow environmental guidelines that help protect the reef's fragile ecosystem","All operators are identical","Certification only affects price",1,"Certified operators follow environmental guidelines designed to protect the Great Barrier Reef's fragile and valuable ecosystem."],
["Adelaide, the capital of South Australia, is often used as a base for exploring which nearby wine region?","Margaret River","Barossa Valley","Hunter Valley","Mornington Peninsula",1,"Adelaide is commonly used as a convenient base for exploring the nearby Barossa Valley wine region."],
["What should consultants know about driving distances in Australia when planning a multi-stop itinerary?","All major cities are within a short drive of each other","Australia is vast, and distances between major cities or regions can require domestic flights rather than driving","Driving is the only way to travel between cities","Distances are negligible across the country",1,"Australia's vast size means distances between major cities or regions often call for domestic flights rather than long-distance driving."]
],
sam:[
["Thompsons For Travel's South America programme focuses primarily on which two countries?","Peru and Chile","Colombia and Ecuador","Venezuela and Bolivia","Brazil and Argentina",3,"Thompsons South America offering centres on Brazil and Argentina as the primary destinations for South African travellers."],
["The iconic statue Christ the Redeemer stands above which Brazilian city?","Sao Paulo","Salvador","Brasilia","Rio de Janeiro",3,"Cristo Redentor overlooks Rio de Janeiro from the summit of Corcovado Mountain and is one of the worlds most recognisable landmarks."],
["Buenos Aires is often called the Paris of South America because of:","Its tropical climate","Its proximity to France","Its French-speaking population","Its European-influenced architecture, boulevards, culture and culinary scene",3,"Buenos Aires shares Paris's passion for culture, food, fashion and beautiful city architecture, earning it the famous nickname."],
["Which Argentine dance is a must-mention cultural highlight of Buenos Aires?","Salsa","Samba","Merengue","Tango",3,"The Tango originated in Buenos Aires and experiencing it live in a milonga is an iconic Buenos Aires experience."],
["Iguazu Falls can be visited from:","Only the Brazilian side","Only the Argentine side","Only by boat from Paraguay","Both the Brazilian (Foz do Iguacu) and Argentine (Puerto Iguazu) sides",3,"Iguazu Falls straddles the Brazil and Argentina border; both sides offer distinct perspectives."],
["Approximate total flight time from Johannesburg to Buenos Aires with one connection:","8 hours","12 hours","16 to 18 hours","24 hours",2,"Most routings connect via Sao Paulo or a European hub, making the total journey approximately 16 to 18 hours."],
["Patagonia, spanning Argentina and Chile, is best known for:","Tropical beaches and warm weather","Urban nightlife and entertainment","Ancient ruins and city tourism","Dramatic mountain and glacial landscapes, hiking and world-class adventure tourism",3,"Patagonia is one of the worlds premier adventure destinations, with Torres del Paine, Perito Moreno Glacier and stunning wilderness."],
["The Perito Moreno Glacier is a highlight of which Argentine national park?","Iguazu National Park","Tierra del Fuego","Talampaya","Los Glaciares National Park",3,"Perito Moreno in Los Glaciares National Park is one of the worlds few advancing glaciers and a truly spectacular sight."],
["Rio de Janeiro Carnival, the worlds largest, is held annually:","In August","In June to July","In December","Before Lent, typically February or March",3,"Rio Carnival takes place in the days before Lent and draws millions of visitors to the famous Sambadrome parades."],
["The famous urban beaches of Rio de Janeiro are:","Flamengo and Botafogo","Buzios and Paraty","Ilha Grande and Angra","Copacabana and Ipanema",3,"Copacabana and Ipanema are two of the worlds most iconic urban beaches, central to Rio's culture, lifestyle and tourism."],
["The official currency of Brazil is:","Argentine Peso","US Dollar","South American Dollar","Brazilian Real",3,"The Brazilian Real (BRL) is Brazils official currency."],
["The official currency of Argentina is:","Brazilian Real","Chilean Peso","US Dollar","Argentine Peso",3,"The Argentine Peso (ARS) is official, though the US dollar is widely used and advisable to carry due to currency instability."],
["The best time for South Africans to visit South Americas summer highlights is:","June to August","Only in December","Year-round equally","November to March, when South America enjoys summer",3,"Both South America and South Africa are in the Southern Hemisphere; November to March is summer in both."],
["The Atacama Desert, one of the driest places on earth, is located in:","Argentina","Brazil","Bolivia","Chile",3,"The Atacama Desert in northern Chile is one of the worlds most extraordinary landscapes, popular for stargazing and desert tours."],
["The key selling point of combining Brazil and Argentina on one itinerary is:","It is the cheapest option","Both countries speak the same language","The flight between them takes one hour","It covers Rio, Buenos Aires and the option to add Iguazu Falls or Patagonia in one trip",3,"A Brazil and Argentina combination delivers iconic cities, world-class nature and outstanding food and culture in one itinerary."],
["Machu Picchu, one of South Americas most iconic ancient sites, is located in which country?","Bolivia","Peru","Ecuador","Colombia",1,"Machu Picchu, the famous Inca citadel, is located high in the Andes Mountains of Peru."],
["The Amazon Rainforest is primarily located within which South American country, though it spans several?","Colombia","Peru","Brazil","Venezuela",2,"While the Amazon spans several countries, the largest share by far lies within Brazil."],
["Easter Island, famous for its giant stone Moai statues, belongs to which country?","Peru","Chile","Argentina","Ecuador",1,"Easter Island (Rapa Nui), home to the iconic Moai statues, is a territory of Chile in the Pacific Ocean."],
["The Galapagos Islands, famous for unique wildlife studied by Charles Darwin, belong to which country?","Peru","Chile","Ecuador","Colombia",2,"The Galapagos Islands are a province of Ecuador, renowned for the unique wildlife that inspired Darwins theory of evolution."],
["Sao Paulo, Brazils largest city, is primarily known to travellers as:","A beach resort town","A major business and culinary hub rather than a beach destination","A ski destination","A small fishing village",1,"Sao Paulo is Brazils business and cultural capital, celebrated for its food scene and city life rather than beaches."],
