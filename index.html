["In an email response to a new enquiry, how many targeted profiling questions are recommended before quoting?","None; quote immediately","2 to 3 targeted questions","10 or more questions at once","Only ask after the first quote is rejected",1,"A focused 2 to 3 question reply gathers enough detail without overwhelming the customer before a first quote."],
["For walk-in customers, what approach is recommended at the very start of the conversation?","Stay standing and ask for the budget immediately","Offer a seat and ask an open question such as What's brought you in today?","Hand them a price list silently","Direct them to book online instead",1,"Offering a seat and an open question slows the conversation down and lets the customer lead with what matters to them."],
["What should a consultant do with notes taken during a customer conversation?","Discard them once the call or chat ends","Keep them so future interactions feel like a continuation, not a restart","Only ever share them with the customer directly","Notes are not necessary in this process",1,"Retained notes let any consultant pick up the conversation later without the customer having to repeat themselves."],
["According to the guide, what is one key business benefit of strong customer profiling?","It has no measurable benefit","It supports repeat business by making customers feel genuinely understood","It only benefits the consultants personal commission","It removes the need for any follow-up",1,"Customers who feel understood are more likely to return, making profiling a driver of repeat business."],
["Why does accurate profiling lead to fewer complaints and changes after booking?","It does not affect post-booking outcomes at all","Understanding the real need leads to more confident, accurate recommendations","It eliminates the need for travel insurance","It guarantees the lowest possible price",1,"Recommendations built on a genuine understanding of the customers needs are far less likely to require post-booking changes."],
["When considering travel style, what distinction does the guide highlight between customers?","Whether they want to pack in activities or slow down completely","Whether they prefer email or phone contact","Whether they have travelled internationally before","Their preferred payment method",0,"Pace preference, whether action-packed or fully relaxed, is highlighted as a key travel style distinction."],
["What does the guide suggest about what a customer believes is included in a stated budget figure?","It is always identical to what the consultant assumes","Consultants should confirm what the customer believes is included, such as flights or meals","This detail never needs confirming","Customers always understate what is included",1,"What a customer assumes is included in their budget can differ significantly from the consultants assumption, so it should be confirmed."],
["What is the central message of the customer profiling guide regarding detailed customer understanding?","Profiling slows down the sales process unnecessarily","The more you know about a customer, the more accurately you can match them and the more they trust you","Profiling is only relevant for luxury bookings","Budget alone is sufficient information to make a recommendation",1,"The guides central premise is that deeper customer understanding leads to better matches and stronger trust."]
],
sp:[
["What is the capital of Spain?","Barcelona","Seville","Madrid","Valencia",2,"Madrid is Spain's capital and sits at the heart of the country."],
["What is the best time of year to travel to mainland Spain?","Summer only","Spring (Apr-Jun) and Autumn (Sep-Oct)","Winter only","Any time, it makes no difference",1,"Spring and Autumn are recommended as the best times to travel to Spain."],
["Do South African travellers need a visa for Spain?","No visa required","Visa on arrival","A Schengen Visa is required","Only for stays over 30 days",2,"Spain is part of the Schengen area, so a Schengen Visa is required."],
["Are there direct flights from South Africa to Spain?","Yes, several daily","No, travellers must route via a European or Middle Eastern hub","Only seasonal direct flights","Only from Cape Town",1,"There are no direct flights from SA; travellers connect via a European or Middle Eastern hub to reach Madrid or Barcelona."],
["Roughly how long is the flight from Istanbul to Madrid or Barcelona?","2 hours","4 hours","6 hours","10 hours",1,"The flight time from Istanbul to Madrid/Barcelona is approximately 4hr 3mins."],
["Which high-speed train network connects Madrid with Barcelona, Seville, Malaga and other major cities?","Eurostar","RENFE & AVE","TGV","Thalys",1,"Spain's high-speed rail network is RENFE & AVE, offering fast, city-centre to city-centre travel."],
["Which iconic architect's work is a major reason to sell Barcelona?","Antoni Gaudi","Santiago Calatrava","Rafael Moneo","Frank Gehry",0,"Gaudi's iconic architecture, including La Sagrada Familia, is a key selling point of Barcelona."],
["Why was extra beach space created in Barcelona?","For a World Expo","For the 1992 Olympic Games","For a film festival","For a royal visit",1,"Extra beach space in Barcelona was created for the 1992 Olympic Games."],
["Which famous street in Barcelona's Gothic Quarter area is described as the most famous street in Europe?","Passeig de Gracia","La Rambla","Carrer de Balmes","Via Laietana",1,"La Rambla is lined with cafes, restaurants and shops and is described as the most famous street in Europe."],
["Which Barcelona landmark requires pre-booking and is considered essential?","Picasso Museum","La Sagrada Familia","Tibidabo amusement park","Casa Batllo",1,"La Sagrada Familia is a key highlight where pre-booking is essential."],
["Which Barcelona neighbourhood is recommended as central and great for first-time visitors?","Gracia","Eixample","El Raval","Sants",1,"Eixample is recommended as central, great for sightseeing, shopping and first-time visitors."],
["Which Madrid museum is a key highlight for art lovers?","Reina Sofia","Prado Museum","Thyssen-Bornemisza","Guggenheim",1,"The Prado Museum is listed as a key highlight of Madrid."],
["Which Madrid neighbourhood is described as trendy with nightlife and a younger vibe?","Salamanca","Malasana","Barrio de las Letras","Chueca",1,"Malasana is described as trendy, with nightlife and a younger vibe."],
["What is the Costa del Sol known for in terms of sunshine?","Over 200 days of sunshine a year","Over 300 days of sunshine a year","Only sunny in summer","Around 150 days of sunshine a year",1,"The Costa del Sol enjoys over 300 days of sunshine a year."],
["Which Costa del Sol airport provides easy access to the region?","Madrid-Barajas","Malaga-Costa del Sol Airport","Barcelona El Prat","Seville Airport",1,"Malaga-Costa del Sol Airport provides easy access to the Costa del Sol region."],
["Which Costa del Sol town is best suited to families and value-conscious travellers close to Malaga airport?","Marbella","Puerto Banus","Torremolinos","Estepona",2,"Torremolinos is close to Malaga airport, with long sandy beaches and good-value hotels, best for families."],
["Which town is sold as offering 'Spanish Riviera vibes without Ibiza prices'?","Torremolinos","Marbella","Benalmadena","Mijas",1,"Marbella is positioned as offering a stylish, upmarket Spanish Riviera feel without Ibiza-level prices."],
["Which glamorous marina town is sold as 'see and be seen' Costa del Sol?","Estepona","Puerto Banus","Mijas","Benalmadena",1,"Puerto Banus is sold as a 'see and be seen' destination with yachts, designer boutiques and nightlife."],
["Which whitewashed Andalusian village is close to golf courses and offers coastal views?","Ronda","Mijas","Estepona","Nerja",1,"Mijas is a classic whitewashed village close to golf courses with stunning coastal views."],
["Which Andalucian city is home to the Alhambra Palace?","Seville","Cordoba","Granada","Ronda",2,"Granada is home to the world-famous Alhambra Palace, which requires pre-booking."],
["Which Andalucian city is home to the Mezquita (Mosque-Cathedral)?","Seville","Cordoba","Granada","Ronda",1,"Cordoba is home to the breathtaking Mezquita and has deep Moorish heritage."],
["Which city is considered the best place to experience flamenco and is often the highlight of an Andalucian itinerary?","Cordoba","Granada","Seville","Ronda",2,"Seville is the artistic and cultural capital of southern Spain and the best place to experience flamenco."],
["Ronda is best sold as what kind of stop?","A beach resort town","A dramatic clifftop stop on a self-drive itinerary","A shopping destination","A ski resort",1,"Ronda's dramatic clifftop setting over El Tajo gorge makes it ideal as a scenic overnight stop on a road trip."],
["Which festival in Pamplona is listed among Spain's must-try experiences?","La Tomatina","Running of the Bulls","Feria de Abril","Las Fallas",1,"The Running of the Bulls festival in Pamplona (July) is listed as a must-try Spain experience."],
["What is the most famous seafood dish associated with Spain's beach chiringuitos?","Ceviche","Paella","Bouillabaisse","Fish and chips",1,"Paella is described as the most famous seafood dish and something no visit to Spain would be complete without."],
["Which market in Barcelona is recommended for experiencing local food culture?","Mercado de San Miguel","La Boqueria Market","Mercado Central","El Rastro",1,"La Boqueria Market in Barcelona is recommended for experiencing Spain's street food and tapas culture."]
],
spi:[
["Spain's islands fall into which two distinct groups?","Balearic and Canary Islands","Azores and Balearics","Canary and Cape Verde Islands","Balearic and Azores",0,"Spain's islands split into the Canary Islands and the Balearic Islands, each offering very different experiences."],
["Where are the Canary Islands located?","In the Mediterranean Sea","Off the northwest coast of Africa","Off the coast of Portugal","In the Atlantic near the UK",1,"The Canary Islands are located off the northwest coast of Africa."],
["What is the climate appeal of the Canary Islands?","Seasonal, best May to October","Year-round spring-like weather, ideal for winter sun","Cold and wet most of the year","Extremely hot year-round",1,"The Canary Islands enjoy year-round spring-like weather, making them ideal for winter sun escapes."],
["Which Canary Island is the largest and dominated by Mount Teide?","Gran Canaria","Lanzarote","Tenerife","Fuerteventura",2,"Tenerife is the largest Canary Island, dominated by Mount Teide, Spain's highest peak at 3,718m."],
["Which Canary Island is often called the 'small continent' due to its varied landscapes?","Tenerife","Gran Canaria","Lanzarote","La Palma",1,"Gran Canaria is often called the small continent because of its mountains, canyons, dunes, beaches and vibrant cities."],
["Which Canary Island is known for its striking volcanic landscape and Timanfaya National Park?","Lanzarote","Fuerteventura","El Hierro","La Gomera",0,"Lanzarote is a striking volcanic island, home to Timanfaya National Park and La Geria vineyards."],
["Which Canary Island is known for long white-sand beaches and ideal wind conditions for surfing?","Fuerteventura","Tenerife","Gran Canaria","Lanzarote",0,"Fuerteventura is known for its long white-sand beaches and ideal wind conditions for surfing and windsurfing."],
["Which smaller, greener Canary Islands are best for nature lovers and hikers?","Tenerife and Gran Canaria","La Palma, La Gomera and El Hierro","Lanzarote and Fuerteventura","None, all islands are equally developed",1,"La Palma, La Gomera and El Hierro are smaller, greener and less developed, ideal for nature lovers and hikers."],
["Which Canary Island has been declared a UNESCO Biosphere Reserve and is home to Caldera de Taburiente National Park?","La Palma","El Hierro","La Gomera","Fuerteventura",0,"La Palma has been declared a UNESCO Biosphere Reserve, with its major attraction being the Caldera de Taburiente National Park."],
["What is recommended for getting around the Canary Islands with flexibility?","Trains","Car hire","Walking only","Cycling only",1,"Car hire is recommended for flexibility when getting around the Canary Islands."],
["Where are the Balearic Islands located?","Off the northwest coast of Africa","In the Mediterranean Sea, east of mainland Spain","In the Atlantic Ocean","South of the Canary Islands",1,"The Balearic Islands are located in the Mediterranean Sea, east of mainland Spain."],
["What is the best season to sell the Balearic Islands?","November to March","May to October","Year-round","December only",1,"The Balearics are seasonal, best sold from May to October."],
["Which is the largest Balearic island with the widest appeal?","Menorca","Ibiza","Mallorca","Formentera",2,"Mallorca is the largest Balearic island, offering beaches, mountains, culture and a golfing mecca with 14 golf courses."],
["Which Balearic island is quieter and less developed, known for calas and fishing villages?","Ibiza","Menorca","Mallorca","Formentera",1,"Menorca is quieter and less developed than Mallorca, known for its calas (coves) and fishing villages."],
["Which Balearic island is the global capital of electronic music from June to September?","Mallorca","Menorca","Ibiza","Formentera",2,"Ibiza is the global capital of electronic music, particularly from June to September, home to clubs like Pacha and Amnesia."],
["Which Ibiza nightlife area is known for stylish, upscale evenings with a beach a short stroll away?","San Antonio","Playa d'en Bossa","Ibiza Town","Santa Eulalia",2,"Ibiza Town offers stylish, upscale evenings; it has no beach itself but Talamanca beach is a short stroll away."],
["How is Formentera reached?","Direct flights only","Only by ferry from Ibiza","By train from Mallorca","By car via a bridge",1,"Formentera is the smallest Balearic island and is reached only by ferry from Ibiza."],
["What is Formentera best known for?","Nightlife and clubs","Crystal-clear waters and relaxed, barefoot luxury","Golf courses","Ski resorts",1,"Formentera is known for crystal-clear waters, a relaxed barefoot luxury feel, and nude-friendly beaches."],
["What is the key selling tip for choosing between the Canary and Balearic Islands?","Always recommend the Canaries","Match island choice to season and traveller type","Always recommend the Balearics","Islands should never be combined with mainland Spain",1,"The core selling tip is to match island choice to season and traveller type: Canaries for winter sun, Balearics for summer lifestyle."],
["Ibiza is best positioned as selling well beyond which single reputation?","Its beaches","Its nightlife","Its food","Its history",1,"The guide notes Ibiza sells well beyond nightlife and should be positioned carefully to highlight its wider appeal."]

tk:[
["What is the capital of Turkey?","Istanbul","Ankara","Izmir","Antalya",1,"Ankara is Turkey's capital, though Istanbul is the country's largest and most visited city."],
["What is the best time of year to visit Turkey?","November to February","May to October","Year-round, no difference","December only",1,"May to October (Spring to Autumn) is recommended as the best time to visit Turkey."],

["Which two airports serve Istanbul?","Istanbul Airport (IST) and Sabiha Gokcen (SAW)","Ankara Esenboga and Izmir Adnan Menderes","Antalya and Bodrum Airports","Istanbul Airport and Ankara Airport",0,"Istanbul is served by Istanbul Airport (IST) and Sabiha Gokcen (SAW), both with efficient domestic connections."],
["What does the Golden Horn divide in Istanbul?","Asia and Europe","The Old City and the New City on the European side","North and South Istanbul","The airport zones",1,"The Golden Horn divides the European side of Istanbul into the Old City and the New City."],
["Which Istanbul landmark is described as the crown jewel of Byzantine architecture?","Blue Mosque","Topkapi Palace","Hagia Sophia","Grand Bazaar",2,"Hagia Sophia is described as the crown jewel of Byzantine architecture."],
["Which Istanbul attraction was the home of the Ottoman Sultans?","Blue Mosque","Topkapi Palace","Galata Tower","Hippodrome",1,"Topkapi Palace was the home of the Ottoman Sultans."],
["Which underground Istanbul attraction is a massive water cavern with Roman support columns?","Grand Bazaar","Basilica Cistern","Hippodrome","Dolmabahce Palace",1,"The Underground Basilica Cistern is a massive underground water cavern with beautiful arches and Roman support columns."],
["What is recommended for getting between the European and Asian sides of Istanbul for sightseeing?","Taxi","Ferry","Funicular","Walking",1,"The ferry is recommended as perfect for sightseeing and hopping between the European and Asian sides of Istanbul."],
["Which region of Turkey is known as the Land of Fairy Chimneys and hot air balloon rides at sunrise?","Bodrum","Cappadocia","Pamukkale","Marmaris",1,"Cappadocia is a UNESCO World Heritage Site famous for hot air balloon rides at sunrise and its fairy chimney rock formations."],
["Which Turkish destination is known as the Cotton Castle, with white travertine terraces and thermal pools?","Cappadocia","Pamukkale","Bodrum","Kusadasi",1,"Pamukkale is known as the Cotton Castle, famous for its white travertine terraces and natural thermal pools."],
["Which coastal town is ideal for Gullet (Blue Cruise) departures?","Marmaris","Kusadasi","Bodrum","Antalya",2,"Bodrum, the Aegean Playground, is ideal for Gullet (Blue Cruise) departures and known for nightlife and beaches."],
["Which Turkish town is the gateway to the ancient ruins of Ephesus?","Marmaris","Kusadasi","Bodrum","Fethiye",1,"Kusadasi is the gateway to Ephesus, ideal for short beach stays or cruise stopovers, with ferry access to Greek islands."],
["Escorted tours in Turkey are best targeted at which type of traveller?","Luxury honeymooners only","Budget-conscious travellers, solo travellers and first-timers","Repeat visitors only","Adventure sports enthusiasts only",1,"Escorted tours offer great value and are ideal for budget-conscious travellers, solo travellers/small groups, and first-timers."],
["What is a recommended tailor-made pairing for Turkey?","Istanbul + Cappadocia + Bodrum","Ankara + Izmir only","Istanbul only","Cappadocia + Pamukkale only",0,"A selling tip is to pair city stays with coastal relaxation, e.g. Istanbul + Cappadocia + Bodrum."],
["What is a recommended family itinerary combining culture and beaches in Turkey?","Istanbul + Kusadasi + Pamukkale","Bodrum + Marmaris only","Cappadocia + Ankara","Istanbul only",0,"Families are best sold Istanbul + Kusadasi + Pamukkale, mixing culture and beaches."],
["What should women be advised regarding mosque visits in Turkey?","No specific dress code applies","They must cover their heads and dress modestly","Only shoulders need covering","Mosques are closed to tourists",1,"Dress modestly when visiting mosques; women must cover their heads, with a free scarf available at the Blue Mosque."],
["Which iconic Turkish dessert features flaky layers with pistachios and syrup?","Katmer","Baklava","Testi Kebab","Simit",1,"Baklava is the flaky, syrup-soaked dessert layered with pistachios."],
["What is a Testi Kebab known for as a dining experience?","A cold seafood platter","A dramatic table-side clay pot crack open","A street food snack","A breakfast dish",1,"The Testi Kebab (Clay Pot Stew) is known for its dramatic table-side crack open presentation."],
["What should consultants recommend carrying in Turkey since not all vendors accept cards?","Only credit cards","Cash","Traveller's cheques","Cryptocurrency",1,"Consultants should recommend carrying cash, as not all small vendors accept cards and street vendors take cash only."]

["What is Lapland most famous for offering travellers?","Beach holidays","A magical winter experience including Northern Lights and Santa Claus","Desert safaris","Summer festivals",1,"Lapland offers one of the most magical winter experiences in the world, including Northern Lights, glass igloos and Santa Claus."],
["When is peak travel season for winter experiences in Lapland?","June to August","November to March","January only","Year-round equally",1,"Lapland is highly seasonal, with peak travel for winter experiences running November to March."],
["What is the best viewing period for the Northern Lights (Aurora Borealis) in Lapland?","June to August","September to March","October only","Year-round",1,"The best viewing period for the Northern Lights is September through March, with peak winter December to February."],

["Rovaniemi is located directly on which geographic line?","The Equator","The Arctic Circle","The Prime Meridian","The Tropic of Cancer",1,"Rovaniemi's Santa Claus Village is located directly on the Arctic Circle line."],

["What type of accommodation is a signature feature of Rovaniemi stays?","Overwater bungalows","Glass igloos","Treehouses","Houseboats",1,"Glass igloos, along with riverside lodges and boutique Arctic hotels, are signature Rovaniemi accommodation styles."],

["What distinguishes Tankavaara from Rovaniemi as a destination?","It is more commercial and family-focused","It offers a more remote, intimate wilderness experience with excellent aurora visibility","It has no accommodation options","It is only accessible by train",1,"Tankavaara offers a more intimate, authentic Arctic feel, is less commercial, and has excellent Northern Lights visibility due to minimal light pollution."],

["Who should Premier Access Ultimate be recommended to?","Solo budget travellers only","Families or short-stay guests wanting to maximise their time in the parks","Only annual passholders","Guests who plan to stay a full week",1,"Premier Access Ultimate is recommended for families or short-stay guests who want to maximise their time in the parks."],
["How many themed Disney Resort Hotels are there?","4","5","6","8",2,"There are 6 themed Disney Resort Hotels, each with its own story and magic."],

["What does Extra Magic Time allow Disney hotel guests to do?","Stay in the park after closing every night","Enter the park prior to normal opening times","Skip all queues automatically","Get free dining at all restaurants",1,"Extra Magic Time allows guests to enter the park prior to normal opening times."],

fr:[

["How far is the Palace of Versailles from Paris as an easy day trip?","10 minutes","40 minutes","2 hours","4 hours",1,"The Palace of Versailles is an easy day trip, only 40 minutes from Paris."],

["Which national park near Marseille features limestone cliffs, turquoise waters and hidden coves?","Calanques National Park","Cevennes National Park","Ecrins National Park","Vanoise National Park",0,"Calanques National Park is a spectacular stretch of limestone cliffs and turquoise waters between Marseille and Cassis."],

["What is the recommended length for a one-way Nile Cruise between Luxor and Aswan?","2 nights","3 or 4 nights (4 recommended)","6 nights","10 nights",1,"Nile Cruises typically run 3 or 4 nights one way, with 4 nights recommended, or 7 nights round trip."],

gr:[

["Which island is described as family-oriented and less crowded, with lovely villages like Naoussa and Lefkes?","Paros","Santorini","Mykonos","Rhodes",0,"Paros is family-oriented and less crowded, with lovely villages like Naoussa and Lefkes, best explored by car."],
["Approximately how many days of sunshine does Greece enjoy a year?","100 days","150 days","Over 250 days","365 days",2,"Greece enjoys over 250 days of sunshine a year, with summer starting early and ending late."],
["When is Greece's peak season, with hot weather and vibrant island nightlife?","April to June","July to August","September to October","November to March",1,"Summer, July to August, is Greece's peak season, with hot weather and vibrant nightlife as island parties are in full swing."],
["Which months are recommended as the best for island-hopping in Greece?","January and February","May, June, September and early October","July and August only","November and December",1,"May, June, September and early October are the best months for island-hopping, avoiding the roughest seas and peak crowds."],
["Why is Greece considered a seasonal destination for ferries and island businesses?","Ferries run year-round with no issues","Ferries won't operate outside summer as the seas are too rough, and some islands largely close for winter","All islands are open and accessible year-round","Ferries only run in winter",1,"Ferries won't operate outside of the summer period as the seas are too rough, and some islands almost 'close down' for winter as owners return to the mainland."],

["Which lush, green Ionian island has Italian influences due to its proximity to Italy, ideal for older travellers or couples?","Corfu","Zakynthos","Kefalonia","Ithaca",0,"Corfu is green and lush with Italian influences due to its close proximity to Italy, easily reached by flight from Athens, ideal for older travellers or couples."],

["Which Sporades island is steeped in history, with historic monasteries in its mountains and forests?","Skiathos","Skopelos","Skyros","Alonissos",1,"Skopelos features mountains, pine forests and historic monasteries, attracting a more discerning traveller."],

["Which popular Greek street food is described as having French fries inside the wrap?","Souvlaki stick","Gyros (Yiros)","Spanakopita","Dolmades",1,"Gyros are described as the best street food, even having French fries inside the wrap, a perfect snack any time of day or night."],
["Which Greek dessert is described as flaky pastry layered with nuts and honey?","Loukoumades","Baklava","Spanakopita","Koulouri",1,"Baklava is a flaky pastry layered with nuts and honey."],
["Which Greek street food staple consists of doughnuts served with honey and cinnamon?","Loukoumades","Koulouri","Souvlaki","Dolmades",0,"Loukoumades are Greek doughnuts served with honey and cinnamon, a street food staple."],

function shuffleOptions(q){
  const opts=[q[1],q[2],q[3],q[4]];
  const idxs=[0,1,2,3];
  for(let i=idxs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idxs[i],idxs[j]]=[idxs[j],idxs[i]];}

  const newCorrect=idxs.indexOf(q[5]);
  return [q[0],newOpts[0],newOpts[1],newOpts[2],newOpts[3],newCorrect,q[6]];

function app(){return document.getElementById('app');}
function hdr(back){return `<div class="hdr"><div class="logo">THOMPSONS <b>FOR TRAVEL</b></div>${back?`<button class="bk" onclick="${back}">&#8592;</button>`:''}</div>`;}
function pbtn(lbl,fn){return `<button class="pb" onclick="${fn}">${lbl}</button>`;}
function sbtn(lbl,fn){return `<button class="sb" onclick="${fn}">${lbl}</button>`;}

// ── SCREENS ────────────────────────────────────────────────
function renderHome(){
  app().innerHTML=`${hdr()}<div class="card" style="text-align:center;margin-top:32px"><div style="font-size:56px;margin-bottom:8px">&#x2708;&#xFE0F;</div><h1>Passport Pro</h1><p style="color:#00AEEF;font-weight:800;font-size:11px;letter-spacing:2px;margin:0 0 12px">TRAVEL KNOWLEDGE CHALLENGE</p><p class="sub">Test your destination knowledge and sales skills. Earn points, build streaks and compete with your colleagues!</p>${pbtn('&#127919; Start Playing','goPlay()')}${sbtn('&#127942; Leaderboard','goLb()')}</div>`;
}

function renderName(){
  app().innerHTML=`${hdr('goHome()')}<div class="card"><h2 style="margin-top:0">What&#39;s your name?</h2><p style="color:#666;font-size:14px;margin:4px 0 0">Your name appears on the leaderboard</p><input type="text" id="ni" placeholder="Enter your name" value="${h(S.name)}" onkeydown="if(event.key==='Enter')setName()"><button class="pb" onclick="setName()">Let&#39;s Go &#8594;</button></div>`;
  setTimeout(()=>document.getElementById('ni')&&document.getElementById('ni').focus(),100);
}

function renderCategories(){
  const dest=CATS.filter(c=>c.type==='dest');
  const skill=CATS.filter(c=>c.type==='skill');
  const learn=CATS.filter(c=>c.type==='learn');
  const cb=c=>`<button class="cb" onclick="pickCat('${c.id}')"><span style="font-size:22px;display:block;margin-bottom:4px">${c.emoji}</span><span style="font-size:11px;font-weight:700;color:#0A52A0;line-height:1.2">${c.name}</span></button>`;
  app().innerHTML=`${hdr('goHome()')}<div class="inner"><h2 style="margin-top:12px">Hi ${h(S.name)}! &#128075;</h2><p class="sub" style="margin-bottom:20px">Pick a category to start your round</p><p class="sl">&#127757; DESTINATIONS</p><div class="g3">${dest.map(cb).join('')}</div><p class="sl">&#128188; SALES SKILLS</p><div class="g3">${skill.map(cb).join('')}</div><p class="sl">&#127807; LEARN</p><div class="g3">${learn.map(cb).join('')}</div></div>`;
}

function renderQuiz(){
  const q=S.qs[S.qi];
  if(!q){endRound();return;}
  const labs=['A','B','C','D'];
  const mult=S.streak>=5?2:S.streak>=3?1.5:1;
  const tPct=(S.tLeft/35)*100;
  const tCol=S.tLeft>15?'#00AEEF':S.tLeft>7?'#FFA500':'#FF4444';
  app().innerHTML=`${hdr()}
<div class="inner">
  <div class="sr">
    <span style="color:#777;font-size:13px;font-weight:600">Q${S.qi+1} / ${S.qs.length}</span>
    <span style="color:#0A52A0;font-weight:800;font-size:16px" id="sc">&#11088; ${S.score.toLocaleString()}</span>
    ${S.streak>=3?`<span class="stk">&#128293; &times;${mult}</span>`:''}
  </div>
  <div class="pgb"><div style="width:${(S.qi/S.qs.length)*100}%"></div></div>
  <div class="tmb"><div id="tw" style="width:${tPct}%;background:${tCol}"></div></div>
  <div class="qb"><p class="qt">${h(q[0])}</p></div>
  <div class="os">${[0,1,2,3].map(i=>`<button class="op" id="op${i}" onclick="handlePick(${i})"><span class="ol">${labs[i]}</span>${h(q[i+1])}</button>`).join('')}</div>
  <div id="fb"></div>
</div>`;
}

function renderResults(){
  const ok=S.answers.filter(a=>a.ok).length;
  const pct=Math.round((ok/S.qs.length)*100);
  const medal=pct>=80?'&#127942;':pct>=60?'&#127775;':'&#128218;';
  const msg=pct>=80?'Outstanding!':pct>=60?'Good effort!':'Keep studying!';
  app().innerHTML=`${hdr()}
<div class="inner">
  <div class="rb">
    <div style="font-size:48px;margin-bottom:8px">${medal}</div>
    <h2 style="color:#fff;font-size:26px;margin:0 0 4px">${S.score.toLocaleString()} pts</h2>
    <p style="color:#00AEEF;font-weight:700;margin:0 0 6px">${ok}/${S.qs.length} correct (${pct}%) &mdash; ${msg}</p>
    <p style="color:rgba(255,255,255,.7);font-size:13px;margin:0">${S.cat.emoji} ${h(S.cat.name)}</p>
  </div>
  <div style="background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(10,82,160,.08)">
    <p style="color:#0A52A0;font-weight:800;font-size:11px;letter-spacing:2px;margin:0 0 12px">QUESTION REVIEW</p>
    <div class="rv">${S.answers.map(a=>`<div class="rvi"><p style="font-size:13px;font-weight:600;margin:0 0 3px">${a.ok?'&#9989;':'&#10060;'} ${h(a.q)}</p>${!a.ok?`<p style="font-size:12px;color:#999;margin:0">Correct: ${h(a.ca)}</p>`:''}</div>`).join('')}</div>
  </div>
  ${pbtn('&#127919; Play Again','goCategories()')}
  ${sbtn('&#127942; View Leaderboard','goLb()')}
</div>`;
}

async function renderLeaderboard(){
  app().innerHTML=`${hdr('goHome()')}<div class="inner" style="padding-top:16px"><div style="text-align:center;padding:48px 20px;color:#888"><div style="font-size:40px;margin-bottom:12px">&#9203;</div><p style="font-size:14px">Loading scores...</p></div></div>`;
  const board=await getLb();
  app().innerHTML=`${hdr('goHome()')}
<div class="inner">
  <h2 style="margin-top:12px">&#127942; Leaderboard</h2>
  <div class="lt">
    <button class="ltb ${S.period==='monthly'?'on':'off'}" onclick="setPeriod('monthly')">Monthly</button>
    <button class="ltb ${S.period==='weekly'?'on':'off'}" onclick="setPeriod('weekly')">Weekly</button>
  </div>
  ${board.length===0
    ?`<div style="text-align:center;padding:48px 20px;color:#bbb"><div style="font-size:48px;margin-bottom:12px">&#127757;</div><p style="font-size:15px">No scores yet &mdash; be the first to play!</p></div>`
    :`<div class="ll">${board.slice(0,20).map((e,i)=>`<div class="lr${e.name===S.name?' me':''}"><div class="lrk" style="background:${i===0?'#FFD700':i===1?'#C0C0C0':i===2?'#CD7F32':'#F0F0F0'};color:${i<3?'#fff':'#999'}">${i+1}</div><div style="flex:1;min-width:0"><p style="margin:0;font-weight:700;font-size:14px;color:#0A52A0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(e.name)}${e.name===S.name?' (you)':''}</p><p style="margin:0;font-size:11px;color:#aaa">${h(e.cat)}</p></div><span style="font-weight:800;color:#0A52A0;font-size:16px;margin-left:8px">${e.score.toLocaleString()}</span></div>`).join('')}</div>`}
  ${pbtn('&#127919; Play Now','goPlay()')}
  <p class="note">&#127758; Scores are shared across all players in real time!</p>
  <p class="note" style="cursor:pointer;text-decoration:underline;margin-top:6px" onclick="goManagerLogin()">Manager Tools</p>
</div>`;}

// ── GAME LOGIC ─────────────────────────────────────────────
function stopTimer(){clearInterval(S.timer);clearTimeout(S.fbto);}
function startTimer(){
  S.tLeft=35;stopTimer();
  S.timer=setInterval(()=>{
    S.tLeft--;
    const tw=document.getElementById('tw');
    if(tw){const p=(S.tLeft/35)*100;const c=S.tLeft>15?'#00AEEF':S.tLeft>7?'#FFA500':'#FF4444';tw.style.width=p+'%';tw.style.background=c;}
    if(S.tLeft<=0){stopTimer();handleTimeout();}
  },1000);
}

function handleTimeout(){
  if(S.showFb)return;
  const q=S.qs[S.qi];
  S.picked=-1;S.showFb=true;S.streak=0;
  S.answers.push({q:q[0],ok:false,pts:0,ua:'No answer',ca:q[q[5]+1],ex:q[6]});
  showFb(false,'Time\'s up!',q[6]);
  [0,1,2,3].forEach(i=>{const el=document.getElementById('op'+i);if(el){el.disabled=true;if(i===q[5])el.classList.add('ok');}});
  S.fbto=setTimeout(advance,1800);
}

function handlePick(idx){
  if(S.picked!==null||S.showFb)return;
  stopTimer();
  const q=S.qs[S.qi];
  const ok=idx===q[5];
  const ns=ok?S.streak+1:0;
  const mult=ns>=5?2:ns>=3?1.5:1;
  const pts=ok?Math.floor((100+Math.floor((S.tLeft/35)*50))*mult):0;
  S.picked=idx;S.showFb=true;S.streak=ns;
  if(ok)S.score+=pts;
  S.answers.push({q:q[0],ok,pts,ua:q[idx+1],ca:q[q[5]+1],ex:q[6]});
  [0,1,2,3].forEach(i=>{const el=document.getElementById('op'+i);if(el){el.disabled=true;if(i===q[5])el.classList.add('ok');else if(i===idx&&!ok)el.classList.add('ng');}});
  const sc=document.getElementById('sc');if(sc)sc.textContent='⭐ '+S.score.toLocaleString();
  showFb(ok,ok?'Correct!':'Not quite.',q[6]);
  S.fbto=setTimeout(advance,1800);
}

function showFb(ok,label,expl){
  const el=document.getElementById('fb');
  if(el)el.innerHTML=`<div class="fbx ${ok?'fok':'fng'}"><strong>${ok?'&#9989;':'&#10060;'} ${label}</strong> ${h(expl)}</div>`;
}

function advance(){
  S.showFb=false;S.picked=null;
  const next=S.qi+1;
  if(next>=S.qs.length){endRound();}
  else{S.qi=next;renderQuiz();startTimer();}
}

function endRound(){
  saveLb(S.name,S.score,S.cat.name,S.answers);
  S.scr='results';renderResults();
}

function startQuiz(cat){
  S.cat=cat;
  const bank=QB[cat.id]||[];
  if(!bank.length){
    app().innerHTML=`${hdr('goCategories()')}<div class="card" style="text-align:center"><div style="font-size:48px;margin-bottom:12px">&#9888;&#65039;</div><h2 style="margin-top:0">Questions not found</h2><p style="color:#666;font-size:14px;margin-bottom:20px">The question bank for <strong>${h(cat.name)}</strong> could not be loaded.</p><button class="pb" onclick="goCategories()">&#8592; Back to Categories</button></div>`;
    return;
  }
  const avoid=S.lastUsed[cat.id]||[];
  let pool=bank.filter(q=>!avoid.includes(q[0]));
  if(pool.length<QN)pool=bank;
  S.qs=shuffle(pool).slice(0,Math.min(QN,pool.length)).map(shuffleOptions);
  S.lastUsed[cat.id]=S.qs.map(q=>q[0]);
  S.qi=0;S.score=0;S.streak=0;S.answers=[];S.picked=null;S.showFb=false;
  S.scr='quiz';renderQuiz();startTimer();
}

// ── NAVIGATION ─────────────────────────────────────────────
function goHome(){stopTimer();S.scr='home';renderHome();}
function goPlay(){S.scr=S.name?'categories':'name';S.name?renderCategories():renderName();}
function goCategories(){S.scr='categories';renderCategories();}
function goLb(){S.scr='leaderboard';renderLeaderboard();}
function setName(){const v=document.getElementById('ni')?.value?.trim();if(v){S.name=v;goCategories();}}
function pickCat(id){const c=CATS.find(x=>x.id===id);if(c)startQuiz(c);}
function setPeriod(p){S.period=p;renderLeaderboard();}

// ── MANAGER TOOLS ──────────────────────────────────────────
let MGR_DATA=null;
function goManagerLogin(){
  app().innerHTML=`${hdr('goLb()')}<div class="card"><h2 style="margin-top:0">&#128274; Manager Tools</h2><p style="color:#666;font-size:14px;margin:4px 0 0">Enter the manager passcode to continue</p><input type="password" id="mp" placeholder="Passcode" onkeydown="if(event.key==='Enter')checkManagerPass()"><button class="pb" onclick="checkManagerPass()">Enter</button></div>`;
  setTimeout(()=>document.getElementById('mp')&&document.getElementById('mp').focus(),100);
}
function checkManagerPass(){
  const v=document.getElementById('mp')?.value;
  if(v===MANAGER_PASS){renderManager();}
  else{alert('Incorrect passcode.');}
}
async function renderManager(){
  app().innerHTML=`${hdr('goLb()')}<div class="inner" style="padding-top:16px"><div style="text-align:center;padding:48px 20px;color:#888"><div style="font-size:40px;margin-bottom:12px">&#9203;</div><p style="font-size:14px">Loading manager data...</p></div></div>`;
  MGR_DATA=await fetchAll();
  renderManagerView();
}
function renderManagerView(){
  const sc=MGR_DATA.scores||{};
  const key=lbKey();
  const board=sc[key]||[];
  app().innerHTML=`${hdr('goLb()')}
<div class="inner">
  <h2 style="margin-top:12px">&#128274; Manager Tools</h2>
  <div class="lt">
    <button class="ltb ${S.period==='monthly'?'on':'off'}" onclick="setMgrPeriod('monthly')">Monthly</button>
    <button class="ltb ${S.period==='weekly'?'on':'off'}" onclick="setMgrPeriod('weekly')">Weekly</button>
  </div>
  ${board.length===0?`<div style="text-align:center;padding:30px;color:#bbb"><p>No scores in this period.</p></div>`:`<div class="ll">${board.map((e,i)=>`<div class="lr" style="display:flex;align-items:center"><div style="flex:1;min-width:0"><p style="margin:0;font-weight:700;font-size:14px;color:#0A52A0">${h(e.name)}</p><p style="margin:0;font-size:11px;color:#aaa">${h(e.cat)} &middot; ${new Date(e.date).toLocaleDateString()}</p></div><span style="font-weight:800;color:#0A52A0;font-size:15px;margin-right:10px">${e.score.toLocaleString()}</span><button class="sb" style="width:auto;padding:6px 12px;margin:0;font-size:12px" onclick="viewAnswers(${i})">View</button></div>`).join('')}</div>`}
  <div style="margin-top:24px;padding-top:16px;border-top:1px solid #ddd">
    <p class="sl" style="margin-bottom:10px">CLEAR SCORES</p>
    <button class="sb" onclick="clearBoard('weekly')">Clear This Week</button>
    <button class="sb" onclick="clearBoard('monthly')">Clear This Month</button>
    <button class="sb" style="border-color:#DC3545;color:#DC3545;margin-top:8px" onclick="clearBoard('all')">Clear Everything</button>
  </div>
</div>`;
}
function setMgrPeriod(p){S.period=p;renderManagerView();}
function viewAnswers(idx){
  const sc=MGR_DATA.scores||{};
  const key=lbKey();
  const board=sc[key]||[];
  const e=board[idx];
  if(!e||!e.answers){alert('No detailed answer breakdown is available for this score.');return;}
  app().innerHTML=`${hdr('renderManagerView()')}
<div class="inner">
  <h2 style="margin-top:12px">${h(e.name)}&#39;s Round</h2>
  <p class="sub" style="margin-bottom:10px">${h(e.cat)} &middot; ${e.score.toLocaleString()} pts &middot; ${new Date(e.date).toLocaleDateString()}</p>
  <div style="background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(10,82,160,.08)">
    <div class="rv" style="max-height:none">${e.answers.map(a=>`<div class="rvi"><p style="font-size:13px;font-weight:600;margin:0 0 3px">${a.ok?'&#9989;':'&#10060;'} ${h(a.q)}</p><p style="font-size:12px;color:#999;margin:0">Answered: ${h(a.ua)}${!a.ok?` &middot; Correct: ${h(a.ca)}`:''}</p></div>`).join('')}</div>
  </div>
  ${pbtn('&#8592; Back','renderManagerView()')}
</div>`;
}
async function clearBoard(period){
  const label=period==='all'?'ALL leaderboard history (every week and month on record)':(period==='weekly'?'this week\'s scores':'this month\'s scores');
  if(!confirm('Are you sure you want to clear '+label+'? This cannot be undone.'))return;
  try{
    const data=await fetchAll();
    const sc=data.scores||{};
    if(period==='all'){Object.keys(sc).forEach(k=>delete sc[k]);}
    else if(period==='weekly'){delete sc[weekKey()];}
    else{delete sc[monthKey()];}
    await fetch(JBURL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':JBKEY},body:JSON.stringify({scores:sc})});
    alert('Scores cleared.');
    renderManager();
  }catch(e){alert('Something went wrong. Please try again.');console.error(e);}
}

renderHome();
</script>
